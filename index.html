<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ysend - Голосовые + Видеозвонки</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --bg-dark: #0a0a0f;
    --bg-primary: #111118;
    --bg-secondary: #1a1a23;
    --bg-tertiary: #222230;
    --accent: #6c63ff;
    --accent-light: #8b84ff;
    --accent-dark: #5b52e0;
    --green: #25D366;
    --red: #f87171;
    --text-primary: #ffffff;
    --text-secondary: #a0a0b8;
    --text-tertiary: #6a6a8a;
    --border: #2a2a3a;
    --transition: all 0.3s ease;
}

body {
    background: var(--bg-dark);
    color: var(--text-primary);
    font-family: 'Inter', sans-serif;
    height: 100vh;
    overflow: hidden;
}

@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes messageIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.05); opacity: 0.8; }
}

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

/* Auth Screen */
.auth-screen {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
}

.auth-card {
    background: rgba(26, 26, 35, 0.95);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(108, 99, 255, 0.2);
    border-radius: 32px;
    padding: 48px 40px;
    width: 460px;
    max-width: 90vw;
    animation: fadeInUp 0.6s ease;
}

.auth-logo {
    text-align: center;
    margin-bottom: 32px;
}

.auth-logo-icon {
    width: 64px;
    height: 64px;
    background: linear-gradient(135deg, var(--accent), var(--accent-light));
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
    font-size: 2rem;
    font-weight: 800;
    animation: pulse 2s infinite;
}

.auth-logo h1 {
    font-size: 2rem;
    background: linear-gradient(135deg, var(--accent), var(--accent-light));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.auth-tabs {
    display: flex;
    gap: 12px;
    background: var(--bg-tertiary);
    border-radius: 16px;
    padding: 4px;
    margin-bottom: 32px;
}

.auth-tab {
    flex: 1;
    padding: 12px;
    background: transparent;
    border: none;
    color: var(--text-secondary);
    border-radius: 12px;
    cursor: pointer;
    font-family: inherit;
    font-weight: 500;
}

.auth-tab.active {
    background: var(--accent);
    color: white;
}

.auth-input {
    width: 100%;
    padding: 14px 16px;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 14px;
    color: var(--text-primary);
    font-family: inherit;
    font-size: 0.95rem;
    outline: none;
    margin-bottom: 16px;
}

.auth-input:focus { border-color: var(--accent); }

.auth-btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    border: none;
    border-radius: 14px;
    color: white;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
}

.auth-btn:hover { transform: translateY(-2px); }

.auth-error {
    color: var(--red);
    font-size: 0.8rem;
    text-align: center;
    margin-top: 16px;
}

/* Main App */
.main-app {
    display: none;
    height: 100vh;
}

.main-app.active { display: flex; }

/* Sidebar */
.chats-sidebar {
    width: 380px;
    background: var(--bg-primary);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.sidebar-header {
    padding: 20px;
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
}

.user-info {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
}

.user-avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-light));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
    font-weight: 600;
    cursor: pointer;
    overflow: hidden;
}

.user-avatar img { width: 100%; height: 100%; object-fit: cover; }

.user-details { flex: 1; }
.user-name { font-weight: 700; }
.user-status { font-size: 0.75rem; color: var(--text-tertiary); }

.icon-btn {
    width: 36px;
    height: 36px;
    background: var(--bg-tertiary);
    border: none;
    border-radius: 12px;
    cursor: pointer;
    color: var(--text-secondary);
    transition: var(--transition);
}

.icon-btn:hover { background: var(--accent); color: white; }

.search-bar { position: relative; }

.search-bar i {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-tertiary);
}

.search-bar input {
    width: 100%;
    padding: 12px 16px 12px 42px;
    background: var(--bg-tertiary);
    border: none;
    border-radius: 24px;
    color: var(--text-primary);
    font-family: inherit;
    outline: none;
}

.chats-tabs {
    display: flex;
    gap: 4px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
}

.chat-tab {
    flex: 1;
    padding: 10px;
    background: transparent;
    border: none;
    color: var(--text-secondary);
    border-radius: 10px;
    cursor: pointer;
    font-family: inherit;
}

.chat-tab.active { background: var(--accent); color: white; }

.chats-list, .people-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 12px;
}

.chat-item, .people-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px;
    border-radius: 16px;
    cursor: pointer;
    transition: var(--transition);
}

.chat-item:hover, .people-item:hover { background: var(--bg-secondary); }
.chat-item.active { background: rgba(108, 99, 255, 0.15); }

.chat-avatar {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-light));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
    font-weight: 600;
    position: relative;
    flex-shrink: 0;
    overflow: hidden;
}

.chat-avatar img { width: 100%; height: 100%; object-fit: cover; }

.online-indicator {
    position: absolute;
    bottom: 2px;
    right: 2px;
    width: 12px;
    height: 12px;
    background: var(--green);
    border-radius: 50%;
    border: 2px solid var(--bg-primary);
}

.chat-info {
    flex: 1;
    min-width: 0;
}

.chat-name { font-weight: 600; margin-bottom: 4px; }
.chat-message {
    font-size: 0.8rem;
    color: var(--text-tertiary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.chat-time {
    font-size: 0.7rem;
    color: var(--text-tertiary);
    text-align: right;
}

.unread-count {
    background: var(--green);
    color: white;
    font-size: 0.7rem;
    border-radius: 20px;
    min-width: 20px;
    height: 20px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0 6px;
}

/* Chat Area */
.chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: var(--bg-dark);
}

.chat-area-header {
    padding: 16px 24px;
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
}

.back-btn {
    display: none;
    width: 36px;
    height: 36px;
    background: var(--bg-tertiary);
    border: none;
    border-radius: 12px;
    cursor: pointer;
    color: var(--text-secondary);
}

.chat-header-info { flex: 1; }
.chat-header-name { font-weight: 700; }
.chat-header-status { font-size: 0.75rem; color: var(--text-tertiary); }
.chat-actions { display: flex; gap: 8px; }

/* Messages */
.messages-container {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.message {
    display: flex;
    gap: 10px;
    max-width: 75%;
    animation: messageIn 0.3s ease;
}

.message.own {
    align-self: flex-end;
    flex-direction: row-reverse;
}

.message-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--bg-tertiary);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    overflow: hidden;
}

.message-avatar img { width: 100%; height: 100%; object-fit: cover; }

.message-bubble {
    background: var(--bg-secondary);
    padding: 10px 14px;
    border-radius: 18px;
    border-bottom-left-radius: 4px;
}

.message.own .message-bubble {
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    border-bottom-left-radius: 18px;
    border-bottom-right-radius: 4px;
}

.message-text { font-size: 0.9rem; line-height: 1.4; }
.message-time {
    font-size: 0.65rem;
    color: var(--text-tertiary);
    margin-top: 4px;
    text-align: right;
}

.message.own .message-time { color: rgba(255,255,255,0.7); }

.sender-name {
    font-size: 0.7rem;
    color: var(--accent-light);
    font-weight: 600;
    margin-bottom: 4px;
}

/* Голосовые сообщения */
.message-voice {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 14px;
    background: var(--bg-tertiary);
    border-radius: 20px;
    cursor: pointer;
    min-width: 180px;
}

.message.own .message-voice {
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
}

.voice-play-btn {
    width: 32px;
    height: 32px;
    background: rgba(255,255,255,0.15);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: var(--transition);
}

.voice-wave {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 3px;
    height: 28px;
}

.voice-wave-bar {
    width: 3px;
    background: currentColor;
    border-radius: 2px;
    transition: height 0.1s;
}

.voice-duration {
    font-size: 0.7rem;
    color: var(--text-secondary);
}

/* Изображения и видео */
.message-image {
    max-width: 250px;
    border-radius: 12px;
    cursor: pointer;
    transition: var(--transition);
}

.message-image:hover { transform: scale(1.02); }

.message-video {
    max-width: 250px;
    border-radius: 12px;
}

.system-message {
    text-align: center;
    font-size: 0.7rem;
    color: var(--text-tertiary);
    padding: 6px 12px;
    background: rgba(255,255,255,0.05);
    border-radius: 20px;
    width: fit-content;
    margin: 4px auto;
}

/* Input Area */
.input-area {
    padding: 16px 24px;
    background: var(--bg-secondary);
    border-top: 1px solid var(--border);
}

.input-container {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: var(--bg-tertiary);
    border-radius: 24px;
    padding: 8px 12px;
}

.message-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text-primary);
    font-family: inherit;
    font-size: 0.9rem;
    resize: none;
    max-height: 100px;
    padding: 8px 4px;
}

.message-input::placeholder { color: var(--text-tertiary); }

.input-btn {
    width: 38px;
    height: 38px;
    background: transparent;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    color: var(--text-secondary);
    transition: var(--transition);
    display: flex;
    align-items: center;
    justify-content: center;
}

.input-btn:hover { background: var(--bg-secondary); color: var(--accent); }
.send-btn { background: var(--accent); color: white; }
.send-btn:hover { background: var(--accent-dark); }

/* Recording Indicator */
.recording-indicator {
    display: none;
    align-items: center;
    gap: 12px;
    padding: 12px;
    background: rgba(248,113,113,0.15);
    border-radius: 20px;
    margin-bottom: 12px;
    animation: pulse 1s infinite;
}

/* Call Overlay */
.call-overlay {
    position: fixed;
    inset: 0;
    background: #000;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 2000;
    flex-direction: column;
}

.call-overlay.active { display: flex; }

.call-video-container {
    position: relative;
    width: 100%;
    height: 100%;
    background: #000;
}

#remoteVideo {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

#localVideo {
    position: absolute;
    bottom: 100px;
    right: 20px;
    width: 120px;
    height: 160px;
    border-radius: 16px;
    object-fit: cover;
    border: 2px solid var(--accent);
    z-index: 10;
    background: var(--bg-tertiary);
}

.call-info {
    position: absolute;
    top: 50px;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 10;
}

.call-name {
    font-size: 1.5rem;
    font-weight: 600;
    color: white;
    text-shadow: 0 0 10px rgba(0,0,0,0.5);
}

.call-status {
    font-size: 0.9rem;
    color: rgba(255,255,255,0.8);
    margin-top: 8px;
}

.call-timer {
    font-size: 1rem;
    color: var(--green);
    margin-top: 4px;
}

.call-controls {
    position: absolute;
    bottom: 40px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    gap: 30px;
    z-index: 10;
}

.call-ctrl-btn {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    font-size: 1.5rem;
    transition: var(--transition);
}

.call-ctrl-btn.mute { background: var(--bg-tertiary); color: white; }
.call-ctrl-btn.mute.active { background: var(--red); color: white; }
.call-ctrl-btn.video { background: var(--bg-tertiary); color: white; }
.call-ctrl-btn.video.active { background: var(--red); color: white; }
.call-ctrl-btn.end { background: var(--red); color: white; }

.call-ctrl-btn:hover { transform: scale(1.05); }

/* Incoming Call */
.incoming-call {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--bg-secondary);
    border: 1px solid var(--accent);
    border-radius: 20px;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 20px;
    z-index: 1500;
    animation: fadeInUp 0.3s ease;
}

.incoming-call-avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-light));
    display: flex;
    align-items: center;
    justify-content: center;
}

.incoming-call-buttons { display: flex; gap: 12px; }

.incoming-call-btn {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    font-size: 1.2rem;
}

.incoming-call-btn.answer { background: var(--green); color: white; }
.incoming-call-btn.decline { background: var(--red); color: white; }

/* Modal */
.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 2000;
}

.modal.active { display: flex; }

.modal-content {
    background: var(--bg-primary);
    border: 1px solid var(--border);
    border-radius: 28px;
    padding: 32px;
    width: 480px;
    max-width: 90vw;
    max-height: 85vh;
    overflow-y: auto;
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
}

.modal-close {
    width: 36px;
    height: 36px;
    background: var(--bg-tertiary);
    border: none;
    border-radius: 12px;
    cursor: pointer;
    color: var(--text-secondary);
}

/* Toast */
.toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 40px;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 3000;
    animation: fadeInUp 0.3s ease;
}

@media (max-width: 768px) {
    .chats-sidebar {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 100%;
        z-index: 100;
        transform: translateX(-100%);
        transition: transform 0.3s ease;
    }
    .chats-sidebar.open { transform: translateX(0); }
    .back-btn { display: flex; }
    .message { max-width: 85%; }
    #localVideo { width: 80px; height: 120px; bottom: 80px; right: 16px; }
}
</style>
</head>
<body>

<div class="auth-screen" id="authScreen">
    <div class="auth-card">
        <div class="auth-logo">
            <div class="auth-logo-icon">Y</div>
            <h1>Ysend</h1>
        </div>
        <div class="auth-sub">Голосовые сообщения + Видеозвонки</div>
        <div class="auth-tabs">
            <button class="auth-tab active" onclick="switchAuthTab('login')">Вход</button>
            <button class="auth-tab" onclick="switchAuthTab('register')">Регистрация</button>
        </div>
        <div id="loginForm">
            <input type="email" id="loginEmail" class="auth-input" placeholder="Email" value="yura@ysend.com">
            <input type="password" id="loginPassword" class="auth-input" placeholder="Пароль" value="5638Yura">
            <button class="auth-btn" onclick="login()">Войти →</button>
        </div>
        <div id="registerForm" style="display: none;">
            <input type="text" id="regNickname" class="auth-input" placeholder="Никнейм">
            <input type="email" id="regEmail" class="auth-input" placeholder="Email">
            <input type="password" id="regPassword" class="auth-input" placeholder="Пароль (мин. 6 символов)">
            <button class="auth-btn" onclick="register()">Создать аккаунт →</button>
        </div>
        <div class="auth-error" id="authError"></div>
    </div>
</div>

<div class="main-app" id="mainApp">
    <div class="chats-sidebar" id="chatsSidebar">
        <div class="sidebar-header">
            <div class="user-info">
                <div class="user-avatar" id="myAvatar" onclick="openProfileModal()">?</div>
                <div class="user-details">
                    <div class="user-name" id="myName">Загрузка...</div>
                    <div class="user-status" id="myStatus">Участник</div>
                </div>
                <div class="header-actions">
                    <button class="icon-btn" onclick="openNewChatModal()"><i class="fas fa-plus"></i></button>
                    <button class="icon-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i></button>
                </div>
            </div>
            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Поиск..." oninput="filterSearch()">
            </div>
        </div>
        <div class="chats-tabs">
            <button class="chat-tab active" onclick="switchTab('chats', this)"><i class="fas fa-comment"></i> Чаты</button>
            <button class="chat-tab" onclick="switchTab('people', this)"><i class="fas fa-users"></i> Люди</button>
        </div>
        <div class="chats-list" id="chatsList"></div>
        <div class="people-list" id="peopleList" style="display: none;"></div>
    </div>

    <div class="chat-area" id="chatArea">
        <div id="noChatSelected" style="flex:1; display:flex; align-items:center; justify-content:center; color:var(--text-tertiary); flex-direction:column; gap:16px;">
            <i class="fas fa-comment-dots" style="font-size: 64px; opacity:0.3;"></i>
            <div>Выберите чат или начните новый</div>
        </div>
        <div id="chatScreen" style="display:none; flex:1; flex-direction:column;">
            <div class="chat-area-header">
                <button class="back-btn" onclick="closeChat()"><i class="fas fa-arrow-left"></i></button>
                <div class="chat-avatar" id="chatAvatar">?</div>
                <div class="chat-header-info">
                    <div class="chat-header-name" id="chatTitle">...</div>
                    <div class="chat-header-status" id="chatStatus">...</div>
                </div>
                <div class="chat-actions">
                    <button class="icon-btn" onclick="startCall('audio')"><i class="fas fa-phone"></i></button>
                    <button class="icon-btn" onclick="startCall('video')"><i class="fas fa-video"></i></button>
                </div>
            </div>
            <div class="messages-container" id="messagesContainer"></div>
            <div class="input-area">
                <div class="recording-indicator" id="recordingIndicator">
                    <i class="fas fa-circle" style="color:var(--red); font-size:12px;"></i>
                    <span>Запись голосового...</span>
                    <span id="recordingTimer">0:00</span>

<script type="module">

import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

const firebaseConfig = {
    apiKey: "AIzaSyB-yTlSlnozIhdpp-0vfAoZK92PHUMf_jU",
    authDomain: "ysend-e71e6.firebaseapp.com",

    storageBucket: "ysend-e71e6.firebasestorage.app",

    appId: "1:78110029191:web:6c4bdf3a40ee0664c6cf22"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// Глобальные переменные
let currentUser = null;
let currentUserData = null;
let currentChat = null;
let currentChatId = null;
let allChats = [];

// WebRTC звонки

// TURN серверы Cloudflare
const iceServers = [
    { urls: "stun:stun.cloudflare.com:3478" },
    { urls: "stun:stun.l.google.com:19302" },
    { 
        urls: "turn:turn.cloudflare.com:3478?transport=udp",

// Вспомогательные функции
function showToast(message, type = 'info') {
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle'}"></i> ${message}`;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
}

function getInitials(name) {
    if (!name) return '?';
    return name.charAt(0).toUpperCase();
}

function formatTime(date) {
    if (!date) return '';
    const d = date.toDate ? date.toDate() : new Date(date);
    const now = new Date();
    if (d.toDateString() === now.toDateString()) {
        return d.toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' });
    }
    return d.toLocaleDateString('ru', { day: '2-digit', month: '2-digit' });
}

function formatDuration(seconds) {
    const mins = Math.floor(seconds / 60);
    const secs = seconds % 60;
    return `${mins}:${secs.toString().padStart(2, '0')}`;
}

function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// ============ ГОЛОСОВЫЕ СООБЩЕНИЯ ============

window.toggleVoiceRecording = async function() {
    if (!currentChatId) {
        showToast('Выберите чат', 'error');
        return;
    }
    
    if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
        return;
    }
    
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        recordingSeconds = 0;
        
        mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
        
        mediaRecorder.onstop = async () => {
            clearInterval(recordingInterval);
            document.getElementById('recordingIndicator').style.display = 'none';
            document.getElementById('voiceBtn').innerHTML = '<i class="fas fa-microphone"></i>';
            stream.getTracks().forEach(track => track.stop());
            
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            if (audioBlob.size < 1000) {
                showToast('Слишком короткое сообщение', 'error');
                return;
            }
            
            showToast('Отправка голосового...', 'info');
            
            const voiceRef = ref(storage, `voice/${currentChatId}/${Date.now()}.webm`);
            await uploadBytes(voiceRef, audioBlob);
            const url = await getDownloadURL(voiceRef);
            
            await addDoc(collection(db, 'chats', currentChatId, 'messages'), {
                senderId: currentUser.uid,
                senderName: currentUserData.nickname,
                type: 'voice',
                url: url,
                duration: formatDuration(recordingSeconds),
                createdAt: serverTimestamp()
            });
            
            await updateDoc(doc(db, 'chats', currentChatId), {
                lastMessage: '🎤 Голосовое сообщение',
                lastMessageTime: serverTimestamp()
            });
            
            showToast('Голосовое отправлено!', 'success');
        };
        
        mediaRecorder.start();
        document.getElementById('voiceBtn').innerHTML = '<i class="fas fa-stop"></i>';
        document.getElementById('recordingIndicator').style.display = 'flex';
        
        recordingInterval = setInterval(() => {
            recordingSeconds++;
            document.getElementById('recordingTimer').textContent = formatDuration(recordingSeconds);
        }, 1000);
        
    } catch (error) {
        console.error('Ошибка записи:', error);
        showToast('Нет доступа к микрофону', 'error');
    }
};

window.cancelRecording = function() {
    if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.onstop = () => {};
        mediaRecorder.stop();
    }
    clearInterval(recordingInterval);
    document.getElementById('recordingIndicator').style.display = 'none';
    document.getElementById('voiceBtn').innerHTML = '<i class="fas fa-microphone"></i>';
};

window.playVoice = function(url, element) {
    const audio = new Audio(url);
    audio.play();
    const playBtn = element.querySelector('.voice-play-btn');
    const originalHTML = playBtn.innerHTML;
    playBtn.innerHTML = '<i class="fas fa-pause"></i>';
    
    audio.onended = () => {
        playBtn.innerHTML = originalHTML;
    };
    
    // Анимация волны
    const bars = element.querySelectorAll('.voice-wave-bar');
    const interval = setInterval(() => {
        if (audio.paused || audio.ended) {
            clearInterval(interval);
            bars.forEach(bar => bar.style.height = '16px');
            return;
        }
        bars.forEach(bar => {
            const height = 8 + Math.random() * 20;
            bar.style.height = height + 'px';
        });
    }, 100);
};

// ============ ФУНКЦИИ ЗВОНКОВ (WebRTC) ============

async function getMediaStream(type) {
    try {
        const constraints = type === 'video' 
            ? { video: true, audio: true }
            : { video: false, audio: true };
        return await navigator.mediaDevices.getUserMedia(constraints);
    } catch (error) {
        showToast('Не удалось получить доступ к камере/микрофону', 'error');
        throw error;
    }
}

function createPeerConnection(targetUserId, isCaller) {
    const pc = new RTCPeerConnection({ iceServers });
    
    if (localStream) {
        localStream.getTracks().forEach(track => {
            pc.addTrack(track, localStream);
        });
    }
    
    pc.onicecandidate = async (event) => {
        if (event.candidate) {
            await addDoc(collection(db, 'calls', currentChatId, 'candidates'), {
                candidate: event.candidate,
                targetUserId: targetUserId,
                senderId: currentUser.uid,
                createdAt: serverTimestamp()
            });
        }
    };
    
    pc.oniceconnectionstatechange = () => {
        console.log('ICE состояние:', pc.iceConnectionState);
        if (pc.iceConnectionState === 'connected') {
            document.getElementById('callStatus').textContent = currentCallType === 'video' ? '📹 В разговоре' : '📞 В разговоре';
        } else if (pc.iceConnectionState === 'failed') {
            showToast('Не удалось установить соединение', 'error');
            hangUp();
        }
    };
    
    pc.ontrack = (event) => {
        const remoteVideo = document.getElementById('remoteVideo');
        if (remoteVideo && event.streams[0]) {
            remoteVideo.srcObject = event.streams[0];
        }
    };
    
    return pc;
}

async function sendSignal(chatId, targetUserId, type, data) {
    await addDoc(collection(db, 'calls', chatId, 'signals'), {
        type: type,
        data: data,
        fromUserId: currentUser.uid,
        targetUserId: targetUserId,
        createdAt: serverTimestamp()
    });
}

function listenForSignals(chatId, targetUserId, isCaller) {
    const signalsRef = collection(db, 'calls', chatId, 'signals');
    const q = query(signalsRef, where('targetUserId', '==', currentUser.uid), orderBy('createdAt', 'asc'));
    
    return onSnapshot(q, async (snapshot) => {
        for (const doc of snapshot.docs) {
            const signal = doc.data();
            
            if (signal.type === 'offer' && !isCaller && peerConnection) {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(signal.data));
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                await sendSignal(chatId, targetUserId, 'answer', answer);
                
            } else if (signal.type === 'answer' && isCaller && peerConnection) {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(signal.data));
                
            } else if (signal.type === 'endCall') {
                hangUp();
                showToast('Собеседник завершил звонок', 'info');
            }
            
            await deleteDoc(doc.ref);
        }
    });
}

function listenForCandidates(chatId) {
    const candidatesRef = collection(db, 'calls', chatId, 'candidates');
    const q = query(candidatesRef, where('targetUserId', '==', currentUser.uid));
    
    return onSnapshot(q, async (snapshot) => {
        for (const doc of snapshot.docs) {
            const data = doc.data();
            if (peerConnection && data.candidate) {
                try {
                    await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
                } catch (e) {
                    console.error('Ошибка добавления ICE кандидата:', e);
                }
            }
            await deleteDoc(doc.ref);
        }
    });
}

window.startCall = async function(type) {
    if (!currentChatId) {
        showToast('Выберите чат', 'error');
        return;
    }
    
    if (currentChat.type === 'group') {
        showToast('Групповые звонки пока не поддерживаются', 'info');
        return;
    }
    
    const otherId = currentChat.members.find(m => m !== currentUser.uid);
    const otherUser = allUsers.find(u => u.uid === otherId);
    
    if (!otherUser) {
        showToast('Пользователь не найден', 'error');
        return;
    }
    
    currentCallType = type;
    
    try {
        localStream = await getMediaStream(type);
        document.getElementById('localVideo').srcObject = localStream;
    } catch (error) {
        return;
    }
    
    peerConnection = createPeerConnection(otherId, true);
    
    const offer = await peerConnection.createOffer();
    await peerConnection.setLocalDescription(offer);
    await sendSignal(currentChatId, otherId, 'offer', offer);
    
    listenForSignals(currentChatId, otherId, true);
    listenForCandidates(currentChatId);
    
    const otherName = otherUser.nickname;
    document.getElementById('callName').textContent = otherName;
    document.getElementById('callStatus').textContent = type === 'video' ? '📹 Видеозвонок...' : '📞 Голосовой звонок...';
    document.getElementById('callTimer').textContent = '';
    document.getElementById('callOverlay').classList.add('active');
    
    const videoBtn = document.getElementById('videoBtn');
    if (type === 'video') {
        videoBtn.style.display = 'flex';
    } else {
        videoBtn.style.display = 'none';
        document.getElementById('localVideo').style.display = 'none';
    }
    
    isCallActive = true;
    
    let connectionCheck = setInterval(() => {
        if (peerConnection && peerConnection.connectionState === 'connected') {
            clearInterval(connectionCheck);
            startCallTimer();
        }
    }, 1000);
    
    setTimeout(() => {
        if (peerConnection && peerConnection.connectionState !== 'connected') {
            clearInterval(connectionCheck);
            if (isCallActive) {
                showToast('Не удалось соединиться. Пользователь не ответил.', 'error');
                hangUp();
            }
        }
    }, 30000);
    
    addDoc(collection(db, 'chats', currentChatId, 'messages'), {
        type: 'system',
        text: `${type === 'video' ? '📹 Видеозвонок' : '📞 Голосовой звонок'} от ${currentUserData.nickname}`,
        senderId: currentUser.uid,
        createdAt: serverTimestamp()
    });
};

function startCallTimer() {
    callStartTime = Date.now();
    callTimerInterval = setInterval(() => {
        if (!isCallActive) {
            clearInterval(callTimerInterval);
            return;
        }
        const elapsed = Math.floor((Date.now() - callStartTime) / 1000);
        document.getElementById('callTimer').textContent = formatDuration(elapsed);
    }, 1000);
}

function showIncomingCall(chatId, callType, callerName, callerId) {
    if (incomingCallDiv) incomingCallDiv.remove();
    if (isCallActive) return;
    
    incomingCallDiv = document.createElement('div');
    incomingCallDiv.className = 'incoming-call';
    incomingCallDiv.innerHTML = `
        <div class="incoming-call-info">
            <div class="incoming-call-avatar">${getInitials(callerName)}</div>
            <div>
                <div style="font-weight:600">${escapeHtml(callerName)}</div>
                <div style="font-size:0.75rem; color:var(--text-tertiary)">${callType === 'video' ? '📹 Видеозвонок' : '📞 Голосовой звонок'}</div>
            </div>
        </div>
        <div class="incoming-call-buttons">
            <button class="incoming-call-btn answer" onclick="answerCall('${chatId}', '${callType}', '${callerName}', '${callerId}')"><i class="fas fa-phone"></i></button>
            <button class="incoming-call-btn decline" onclick="declineCall('${chatId}', '${callerId}')"><i class="fas fa-times"></i></button>
        </div>
    `;
    document.body.appendChild(incomingCallDiv);
    
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    
    setTimeout(() => {
        if (incomingCallDiv && incomingCallDiv.parentNode) {
            incomingCallDiv.remove();
            incomingCallDiv = null;
        }
    }, 30000);
}

window.answerCall = async function(chatId, callType, callerName, callerId) {
    if (incomingCallDiv) incomingCallDiv.remove();
    incomingCallDiv = null;
    
    currentChatId = chatId;
    currentCallType = callType;
    
    const chat = allChats.find(c => c.id === chatId);
    if (chat) {
        currentChat = chat;
        await openChatAfterAnswer();
    }
    
    try {
        localStream = await getMediaStream(callType);
        document.getElementById('localVideo').srcObject = localStream;
    } catch (error) {
        return;
    }
    
    peerConnection = createPeerConnection(callerId, false);
    listenForSignals(chatId, callerId, false);
    listenForCandidates(chatId);
    
    document.getElementById('callName').textContent = callerName;
    document.getElementById('callStatus').textContent = callType === 'video' ? '📹 Соединение...' : '📞 Соединение...';
    document.getElementById('callTimer').textContent = '';
    document.getElementById('callOverlay').classList.add('active');
    
    const videoBtn = document.getElementById('videoBtn');
    if (callType === 'video') {
        videoBtn.style.display = 'flex';
    } else {
        videoBtn.style.display = 'none';
        document.getElementById('localVideo').style.display = 'none';
    }
    
    isCallActive = true;
    
    let connectionCheck = setInterval(() => {
        if (peerConnection && peerConnection.connectionState === 'connected') {
            clearInterval(connectionCheck);
            startCallTimer();
        }
    }, 1000);
};

async function openChatAfterAnswer() {
    document.getElementById('chatAvatar').innerHTML = currentChat.type === 'group' ? '<i class="fas fa-users"></i>' : getInitials(currentChat.name);
    document.getElementById('chatTitle').textContent = currentChat.name;
    document.getElementById('chatStatus').textContent = currentChat.type === 'group' ? `${currentChat.members.length} участников` : 'В сети';
    document.getElementById('noChatSelected').style.display = 'none';
    document.getElementById('chatScreen').style.display = 'flex';
    renderChatsList();
    loadMessages();
}

window.declineCall = async function(chatId, callerId) {
    if (incomingCallDiv) incomingCallDiv.remove();
    incomingCallDiv = null;
    await sendSignal(chatId, callerId, 'endCall', {});
    showToast('Звонок отклонён', 'info');
};

window.hangUp = function() {
    if (callTimerInterval) clearInterval(callTimerInterval);
    
    if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
    }
    
    if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
    }
    
    if (isCallActive && currentChatId && currentChat) {
        const elapsed = Math.floor((Date.now() - callStartTime) / 1000);
        if (elapsed > 0) {
            addDoc(collection(db, 'chats', currentChatId, 'messages'), {
                type: 'system',
                text: `📵 Звонок завершён (${formatDuration(elapsed)})`,
                senderId: currentUser.uid,
                createdAt: serverTimestamp()
            });
        }
    }
    
    document.getElementById('localVideo').srcObject = null;
    document.getElementById('remoteVideo').srcObject = null;
    document.getElementById('localVideo').style.display = 'block';
    document.getElementById('callOverlay').classList.remove('active');
    
    isCallActive = false;
    callStartTime = 0;
    currentCallType = null;
};

window.toggleAudioMute = function() {
    if (localStream) {
        const audioTrack = localStream.getAudioTracks()[0];
        if (audioTrack) {
            audioTrack.enabled = !audioTrack.enabled;
            const muteBtn = document.getElementById('muteBtn');
            if (audioTrack.enabled) {
                muteBtn.classList.remove('active');
                muteBtn.innerHTML = '<i class="fas fa-microphone"></i>';
            } else {
                muteBtn.classList.add('active');
                muteBtn.innerHTML = '<i class="fas fa-microphone-slash"></i>';
            }
        }
    }
};

window.toggleVideo = function() {
    if (localStream) {
        const videoTrack = localStream.getVideoTracks()[0];
        if (videoTrack) {
            videoTrack.enabled = !videoTrack.enabled;
            const videoBtn = document.getElementById('videoBtn');
            if (videoTrack.enabled) {
                videoBtn.classList.remove('active');
                videoBtn.innerHTML = '<i class="fas fa-video"></i>';
            } else {
                videoBtn.classList.add('active');
                videoBtn.innerHTML = '<i class="fas fa-video-slash"></i>';
            }
        }
    }
};

function listenForCallOffers() {
    const signalsRef = collectionGroup(db, 'signals');
    const signalsQuery = query(signalsRef, where('targetUserId', '==', currentUser?.uid || ''));
    
    return onSnapshot(signalsQuery, (snapshot) => {
        for (const doc of snapshot.docs) {
            const signal = doc.data();
            if (signal.type === 'offer' && !isCallActive && !incomingCallDiv) {
                const chatId = doc.ref.path.split('/')[1];
                const callerId = signal.fromUserId;
                const caller = allUsers.find(u => u.uid === callerId);
                if (caller) {
                    showIncomingCall(chatId, 'video', caller.nickname, callerId);
                }
            }
        }
    });
}

// ============ ОСТАЛЬНЫЕ ФУНКЦИИ ============

window.switchAuthTab = function(tab) {
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const tabs = document.querySelectorAll('.auth-tab');
    
    if (tab === 'login') {
        loginForm.style.display = 'block';
        registerForm.style.display = 'none';
        tabs[0].classList.add('active');
        tabs[1].classList.remove('active');
    } else {
        loginForm.style.display = 'none';
        registerForm.style.display = 'block';
        tabs[0].classList.remove('active');
        tabs[1].classList.add('active');
    }
};

window.register = async function() {
    const nickname = document.getElementById('regNickname').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPassword').value;
    const errorDiv = document.getElementById('authError');
    
    if (!nickname || !email || !password) {
        errorDiv.textContent = 'Заполните все поля';
        return;
    }
    if (password.length < 6) {
        errorDiv.textContent = 'Пароль должен быть не менее 6 символов';
        return;
    }
    
    try {
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        await updateProfile(cred.user, { displayName: nickname });
        await setDoc(doc(db, 'users', cred.user.uid), {
            uid: cred.user.uid, nickname, email, avatar: null, role: 'member',
            online: true, createdAt: serverTimestamp()
        });
        showToast('Аккаунт создан!', 'success');
    } catch (error) {
        const errors = {
            'auth/email-already-in-use': 'Email уже используется',
            'auth/weak-password': 'Слабый пароль',
            'auth/invalid-email': 'Неверный email'
        };
        errorDiv.textContent = errors[error.code] || error.message;
    }
};

window.login = async function() {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const errorDiv = document.getElementById('authError');
    
    if (!email || !password) {
        errorDiv.textContent = 'Заполните все поля';
        return;
    }
    try {
        await signInWithEmailAndPassword(auth, email, password);
    } catch (error) {
        errorDiv.textContent = 'Неверный email или пароль';
    }
};

window.logout = async function() {
    if (currentUser) {
        await updateDoc(doc(db, 'users', currentUser.uid), { online: false });
    }
    if (isCallActive) hangUp();
    await signOut(auth);
};

async function createYuraAccount() {
    const q = query(collection(db, 'users'), where('nickname', '==', 'Yura'));
    const snap = await getDocs(q);
    if (snap.empty) {
        try {
            const cred = await createUserWithEmailAndPassword(auth, 'yura@ysend.com', '5638Yura');
            await updateProfile(cred.user, { displayName: 'Yura' });
            await setDoc(doc(db, 'users', cred.user.uid), {
                uid: cred.user.uid, nickname: 'Yura', email: 'yura@ysend.com',
                avatar: null, role: 'owner', online: false, createdAt: serverTimestamp()
            });
        } catch(e) { console.log('Yura already exists'); }
    }
}

async function loadAllUsers() {
    const snap = await getDocs(collection(db, 'users'));
    allUsers = snap.docs.map(d => ({ id: d.id, ...d.data() }));
}

async function loadUserProfile() {
    const avatar = document.getElementById('myAvatar');
    if (currentUserData.avatar) {
        avatar.innerHTML = `<img src="${currentUserData.avatar}">`;
    } else {
        avatar.textContent = getInitials(currentUserData.nickname);
    }
    document.getElementById('myName').textContent = currentUserData.nickname;
}

async function loadChats() {
    if (chatsUnsubscribe) chatsUnsubscribe();
    const q = query(collection(db, 'chats'), where('members', 'array-contains', currentUser.uid));
    chatsUnsubscribe = onSnapshot(q, (snap) => {
        allChats = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        allChats.sort((a, b) => (b.lastMessageTime?.seconds || 0) - (a.lastMessageTime?.seconds || 0));
        renderChatsList();
    });
}

function renderChatsList() {
    const container = document.getElementById('chatsList');
    if (allChats.length === 0) {
        container.innerHTML = '<div style="padding:20px; text-align:center; color:var(--text-tertiary);">Нет чатов</div>';
        return;
    }
    
    container.innerHTML = allChats.map(chat => {
        const isGroup = chat.type === 'group';
        let name;
        if (isGroup) {
            name = chat.name || 'Группа';
        } else {
            const otherId = chat.members.find(m => m !== currentUser.uid);
            const other = allUsers.find(u => u.uid === otherId);
            name = other?.nickname || 'Пользователь';
        }
        const unread = chat.unread?.[currentUser.uid] || 0;
        const active = currentChatId === chat.id;
        
        return `
            <div class="chat-item ${active ? 'active' : ''}" onclick="selectChat('${chat.id}')">
                <div class="chat-avatar">
                    ${isGroup ? '<i class="fas fa-users"></i>' : getInitials(name)}
                </div>
                <div class="chat-info">
                    <div class="chat-name">${escapeHtml(name)}</div>
                    <div class="chat-message">${escapeHtml(chat.lastMessage || 'Нет сообщений')}</div>
                </div>
                <div class="chat-time">
                    <div>${formatTime(chat.lastMessageTime)}</div>
                    ${unread > 0 ? `<div class="unread-count">${unread}</div>` : ''}
                </div>
            </div>
        `;
    }).join('');
}

function renderPeopleList() {
    const container = document.getElementById('peopleList');
    const filtered = allUsers.filter(u => u.uid !== currentUser.uid);
    
    if (filtered.length === 0) {
        container.innerHTML = '<div style="padding:20px; text-align:center; color:var(--text-tertiary);">Пользователи не найдены</div>';
        return;
    }
    
    container.innerHTML = filtered.map(user => `
        <div class="people-item" onclick="startDirectChat('${user.uid}')">
            <div class="chat-avatar">
                ${user.avatar ? `<img src="${user.avatar}">` : getInitials(user.nickname)}
                ${user.online ? '<div class="online-indicator"></div>' : ''}
            </div>
            <div class="chat-info">
                <div class="chat-name">${escapeHtml(user.nickname)}</div>
                <div class="chat-message">${user.online ? 'В сети' : 'Не в сети'}</div>
            </div>
        </div>
    `).join('');
}

window.filterSearch = function() {
    const activeTab = document.querySelector('.chat-tab.active').textContent;
    if (activeTab.includes('Чаты')) {
        renderChatsList();
    } else {
        renderPeopleList();
    }
};

window.switchTab = function(tab, btn) {
    document.querySelectorAll('.chat-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    
    const chatsList = document.getElementById('chatsList');
    const peopleList = document.getElementById('peopleList');
    
    if (tab === 'chats') {
        chatsList.style.display = 'block';
        peopleList.style.display = 'none';
        renderChatsList();
    } else {
        chatsList.style.display = 'none';
        peopleList.style.display = 'block';
        renderPeopleList();
    }
};

window.selectChat = async function(chatId) {
    const chat = allChats.find(c => c.id === chatId);
    if (!chat) return;
    
    currentChat = chat;
    currentChatId = chatId;
    
    await updateDoc(doc(db, 'chats', chatId), { [`unread.${currentUser.uid}`]: 0 }).catch(() => {});
    
    const isGroup = chat.type === 'group';
    let name;
    if (isGroup) {
        name = chat.name || 'Группа';
    } else {
        const otherId = chat.members.find(m => m !== currentUser.uid);
        const other = allUsers.find(u => u.uid === otherId);
        name = other?.nickname || 'Пользователь';
    }
    
    document.getElementById('chatAvatar').innerHTML = isGroup ? '<i class="fas fa-users"></i>' : getInitials(name);
    document.getElementById('chatTitle').textContent = name;
    document.getElementById('chatStatus').textContent = isGroup ? `${chat.members.length} участников` : 'В сети';
    document.getElementById('noChatSelected').style.display = 'none';
    document.getElementById('chatScreen').style.display = 'flex';
    document.getElementById('chatsSidebar').classList.remove('open');
    
    renderChatsList();
    loadMessages();
};

function closeChat() {
    currentChat = null;
    currentChatId = null;
    document.getElementById('noChatSelected').style.display = 'flex';
    document.getElementById('chatScreen').style.display = 'none';
    if (messagesUnsubscribe) messagesUnsubscribe();
}

window.closeChat = closeChat;

function loadMessages() {
    if (messagesUnsubscribe) messagesUnsubscribe();
    const q = query(collection(db, 'chats', currentChatId, 'messages'), orderBy('createdAt', 'asc'));
    messagesUnsubscribe = onSnapshot(q, (snap) => {
        const container = document.getElementById('messagesContainer');
        container.innerHTML = '';
        if (snap.empty) {
            container.innerHTML = '<div style="text-align:center; color:var(--text-tertiary); padding:40px;">Нет сообщений</div>';
            return;
        }
        snap.forEach(doc => renderMessage(doc.data()));
        container.scrollTop = container.scrollHeight;
    });
}

function renderMessage(msg) {
    const isMine = msg.senderId === currentUser.uid;
    const sender = allUsers.find(u => u.uid === msg.senderId);
    const senderName = sender?.nickname || msg.senderName || '?';
    
    if (msg.type === 'system') {
        const div = document.createElement('div');
        div.className = 'system-message';
        div.textContent = msg.text;
        document.getElementById('messagesContainer').appendChild(div);
        return;
    }
    
    const messageDiv = document.createElement('div');
    messageDiv.className = `message ${isMine ? 'own' : ''}`;
    
    let content = '';
    
    if (msg.type === 'image') {
        content = `<img class="message-image" src="${msg.url}" onclick="openLightbox('${msg.url}')">`;
    } else if (msg.type === 'video') {
        content = `<video class="message-video" controls src="${msg.url}"></video>`;
    } else if (msg.type === 'voice') {
        content = `
            <div class="message-voice" onclick="playVoice('${msg.url}', this)">
                <div class="voice-play-btn"><i class="fas fa-play"></i></div>
                <div class="voice-wave">
                    ${'<div class="voice-wave-bar" style="height:16px"></div>'.repeat(15)}
                </div>
                <div class="voice-duration">${msg.duration || '0:00'}</div>
            </div>
        `;
    } else {
        content = `<div class="message-text">${escapeHtml(msg.text)}</div>`;
    }
    
    messageDiv.innerHTML = `
        ${!isMine ? `<div class="message-avatar">${sender?.avatar ? `<img src="${sender.avatar}">` : getInitials(senderName)}</div>` : ''}
        <div class="message-bubble">
            ${currentChat?.type === 'group' && !isMine ? `<div class="sender-name">${escapeHtml(senderName)}</div>` : ''}
            ${content}
            <div class="message-time">${formatTime(msg.createdAt)}</div>
        </div>
    `;
    document.getElementById('messagesContainer').appendChild(messageDiv);
}

window.openLightbox = function(url) {
    const div = document.createElement('div');
    div.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.95); display:flex; align-items:center; justify-content:center; z-index:3000; cursor:pointer;';
    div.innerHTML = `<img src="${url}" style="max-width:90vw; max-height:90vh; border-radius:16px;">`;
    div.onclick = () => div.remove();
    document.body.appendChild(div);
};

window.sendMessage = async function() {
    if (!currentChatId) return;
    const input = document.getElementById('messageInput');
    const text = input.value.trim();
    
    if (pendingFile) {
        await uploadMedia();
        return;
    }
    
    if (!text) return;
    input.value = '';
    input.style.height = 'auto';
    
    await addDoc(collection(db, 'chats', currentChatId, 'messages'), {
        senderId: currentUser.uid,
        senderName: currentUserData.nickname,
        text,
        type: 'text',
        createdAt: serverTimestamp()
    });
    
    await updateDoc(doc(db, 'chats', currentChatId), {
        lastMessage: text,
        lastMessageTime: serverTimestamp()
    });
};

async function uploadMedia() {
    if (!pendingFile) return;
    showToast('Загрузка...', 'info');
    const fileRef = ref(storage, `chats/${currentChatId}/${Date.now()}_${pendingFile.name}`);
    await uploadBytes(fileRef, pendingFile);
    const url = await getDownloadURL(fileRef);
    const type = pendingFile.type.startsWith('video') ? 'video' : 'image';
    await addDoc(collection(db, 'chats', currentChatId, 'messages'), {
        senderId: currentUser.uid,
        senderName: currentUserData.nickname,
        type, url,
        createdAt: serverTimestamp()
    });
    await updateDoc(doc(db, 'chats', currentChatId), {
        lastMessage: type === 'image' ? '📷 Фото' : '🎥 Видео',
        lastMessageTime: serverTimestamp()
    });
    pendingFile = null;
    showToast('Отправлено!', 'success');
}

window.handleFileSelect = function(event) {
    pendingFile = event.target.files[0];
    if (pendingFile) showToast(`Файл выбран: ${pendingFile.name}`, 'info');
    event.target.value = '';
};

window.handleKeyPress = function(event) {
    if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
    }
};

window.autoResize = function(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 100) + 'px';
};

window.startDirectChat = async function(otherUid) {
    const existing = allChats.find(c => 
        c.type === 'direct' && 
        c.members.includes(otherUid) && 
        c.members.includes(currentUser.uid)
    );
    
    if (existing) {
        await selectChat(existing.id);
        closeModal('newChatModal');
        return;
    }
    
    const chatRef = await addDoc(collection(db, 'chats'), {
        type: 'direct',
        members: [currentUser.uid, otherUid],
        createdAt: serverTimestamp(),
        lastMessage: 'Чат создан',
        lastMessageTime: serverTimestamp(),
        unread: {}
    });
    
    await selectChat(chatRef.id);
    closeModal('newChatModal');
};

window.openNewChatModal = function() {
    document.getElementById('newChatSearch').value = '';
    document.getElementById('newChatUsersList').innerHTML = '';
    document.getElementById('newChatModal').classList.add('active');
    searchNewChatUsers();
};

window.searchNewChatUsers = function() {
    const search = document.getElementById('newChatSearch').value.toLowerCase();
    let filtered = allUsers.filter(u => u.uid !== currentUser.uid);
    if (search) filtered = filtered.filter(u => u.nickname.toLowerCase().includes(search));
    
    const container = document.getElementById('newChatUsersList');
    if (filtered.length === 0) {
        container.innerHTML = '<div style="padding:20px; text-align:center; color:var(--text-tertiary);">Пользователи не найдены</div>';
        return;
    }
    
    container.innerHTML = filtered.map(user => `
        <div class="people-item" onclick="startDirectChat('${user.uid}')">
            <div class="chat-avatar" style="width:44px; height:44px;">
                ${user.avatar ? `<img src="${user.avatar}">` : getInitials(user.nickname)}
            </div>
            <div class="chat-info">
                <div class="chat-name">${escapeHtml(user.nickname)}</div>
                <div class="chat-message">${user.online ? 'В сети' : 'Не в сети'}</div>
            </div>
        </div>
    `).join('');
};

window.openProfileModal = function() {
    document.getElementById('profileNickname').value = currentUserData.nickname;
    const profileAvatar = document.getElementById('profileAvatar');
    if (currentUserData.avatar) {
        profileAvatar.innerHTML = `<img src="${currentUserData.avatar}">`;
    } else {
        profileAvatar.textContent = getInitials(currentUserData.nickname);
    }
    document.getElementById('profileModal').classList.add('active');
};

window.uploadAvatar = async function(event) {
    const file = event.target.files[0];
    if (!file) return;
    
    showToast('Загрузка аватара...', 'info');
    const avatarRef = ref(storage, `avatars/${currentUser.uid}`);
    await uploadBytes(avatarRef, file);
    const url = await getDownloadURL(avatarRef);
    await updateProfile(auth.currentUser, { photoURL: url });
    await updateDoc(doc(db, 'users', currentUser.uid), { avatar: url });
    currentUserData.avatar = url;
    await loadUserProfile();
    showToast('Аватар обновлён!', 'success');
};

window.saveProfile = async function() {
    const newNickname = document.getElementById('profileNickname').value.trim();
    if (!newNickname) return;
    
    await updateProfile(auth.currentUser, { displayName: newNickname });
    await updateDoc(doc(db, 'users', currentUser.uid), { nickname: newNickname });
    currentUserData.nickname = newNickname;
    await loadUserProfile();
    closeModal('profileModal');
    showToast('Профиль обновлён!', 'success');
};

window.closeModal = function(modalId) {
    document.getElementById(modalId).classList.remove('active');
};

// Auth state listener
onAuthStateChanged(auth, async (user) => {
    if (user) {
        currentUser = user;
        const userDoc = await getDoc(doc(db, 'users', user.uid));
        
        if (!userDoc.exists()) {
            await setDoc(doc(db, 'users', user.uid), {
                uid: user.uid, nickname: user.displayName || 'User', email: user.email,
                avatar: null, role: 'member', online: true, createdAt: serverTimestamp()
            });
            currentUserData = { uid: user.uid, nickname: user.displayName || 'User', role: 'member' };
        } else {
            currentUserData = userDoc.data();
            await updateDoc(doc(db, 'users', user.uid), { online: true });
        }
        
        document.getElementById('authScreen').style.display = 'none';
        document.getElementById('mainApp').classList.add('active');
        
        await createYuraAccount();
        await loadAllUsers();
        await loadUserProfile();
        await loadChats();
        listenForCallOffers();
    } else {
        if (currentUser) {
            await updateDoc(doc(db, 'users', currentUser.uid), { online: false }).catch(() => {});
        }
        if (isCallActive) hangUp();
        document.getElementById('authScreen').style.display = 'flex';
        document.getElementById('mainApp').classList.remove('active');
        currentUser = null;
        if (messagesUnsubscribe) messagesUnsubscribe();
        if (chatsUnsubscribe) chatsUnsubscribe();
    }
});

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ysend</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0d0f;
  --surface:#16161a;
  --surface2:#1e1e24;
  --surface3:#26262e;
  --border:rgba(255,255,255,0.07);
  --accent:#7c6af7;
  --accent2:#a78bfa;
  --green:#34d399;
  --red:#f87171;
  --text:#f0f0f5;
  --text2:#8888a0;
  --text3:#4a4a60;
  --msg-out:#2d2460;
  --msg-in:#1e1e24;
  --radius:14px;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Syne',sans-serif}

/* ───── AUTH ───── */
#authScreen{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 30% 20%, rgba(124,106,247,0.15) 0%, transparent 60%),
             radial-gradient(ellipse at 80% 80%, rgba(167,139,250,0.08) 0%, transparent 50%), var(--bg);
  z-index:100;
}
.auth-card{
  width:380px;background:var(--surface);border:1px solid var(--border);
  border-radius:24px;padding:40px;
  box-shadow:0 40px 80px rgba(0,0,0,0.5);
}
.auth-logo{font-size:28px;font-weight:800;letter-spacing:-1px;margin-bottom:8px}
.auth-logo span{color:var(--accent)}
.auth-sub{color:var(--text2);font-size:13px;margin-bottom:32px}
.auth-tabs{display:flex;gap:4px;margin-bottom:24px;background:var(--surface2);border-radius:10px;padding:4px}
.auth-tab{flex:1;padding:8px;text-align:center;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;color:var(--text2);transition:all .2s}
.auth-tab.active{background:var(--accent);color:#fff}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:600;color:var(--text2);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.field input{
  width:100%;background:var(--surface2);border:1px solid var(--border);
  border-radius:10px;padding:12px 14px;color:var(--text);font-family:'Syne',sans-serif;font-size:14px;
  outline:none;transition:border-color .2s;
}
.field input:focus{border-color:var(--accent)}
.btn-primary{
  width:100%;padding:13px;background:var(--accent);border:none;border-radius:10px;
  color:#fff;font-family:'Syne',sans-serif;font-size:14px;font-weight:700;cursor:pointer;
  transition:opacity .2s,transform .1s;
}
.btn-primary:hover{opacity:.9}
.btn-primary:active{transform:scale(.98)}
.auth-err{color:var(--red);font-size:12px;margin-top:10px;text-align:center;min-height:16px}

/* ───── APP LAYOUT ───── */
#app{display:none;height:100vh;flex-direction:row}
#app.visible{display:flex}

/* SIDEBAR */
.sidebar{
  width:300px;flex-shrink:0;background:var(--surface);
  border-right:1px solid var(--border);display:flex;flex-direction:column;
}
.sidebar-top{
  padding:16px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;
}
.my-avatar{
  width:38px;height:38px;border-radius:50%;background:var(--accent);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;
  cursor:pointer;overflow:hidden;flex-shrink:0;border:2px solid var(--accent2);
}
.my-avatar img{width:100%;height:100%;object-fit:cover}
.my-name{font-weight:700;font-size:14px;flex:1;cursor:pointer}
.sidebar-actions{display:flex;gap:6px}
.icon-btn{
  width:32px;height:32px;border-radius:8px;background:var(--surface2);border:none;
  color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .2s,color .2s;font-size:16px;
}
.icon-btn:hover{background:var(--surface3);color:var(--text)}

.search-wrap{padding:10px 16px;border-bottom:1px solid var(--border)}
.search-pill{
  display:flex;align-items:center;gap:8px;width:100%;background:var(--surface2);
  border:1px solid var(--border);border-radius:20px;padding:9px 14px;
  transition:border-color .2s,background .2s;
}
.search-pill:focus-within{border-color:var(--accent);background:var(--surface3)}
.search-pill svg{flex-shrink:0;color:var(--text3);transition:color .2s}
.search-pill:focus-within svg{color:var(--accent2)}
.search-input{
  flex:1;background:transparent;border:none;color:var(--text);
  font-family:'Syne',sans-serif;font-size:13px;outline:none;min-width:0;
}
.search-input::placeholder{color:var(--text3)}

/* ICON BUTTONS */
.icon-btn svg{width:17px;height:17px}
.attach-opt svg{width:16px;height:16px;flex-shrink:0;color:var(--accent2)}
.call-btn svg{width:24px;height:24px}
.send-btn svg{width:18px;height:18px}
.record-btn svg{width:18px;height:18px}
.voice-play svg{width:13px;height:13px}
.msg-file svg{width:18px;height:18px;color:var(--accent2);flex-shrink:0}

.chat-list{flex:1;overflow-y:auto;padding:8px}
.chat-item{
  display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;
  cursor:pointer;transition:background .15s;margin-bottom:2px;
}
.chat-item:hover{background:var(--surface2)}
.chat-item.active{background:var(--surface3)}
.ci-avatar{
  width:44px;height:44px;border-radius:50%;background:var(--accent);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;
  flex-shrink:0;overflow:hidden;position:relative;
}
.ci-avatar img{width:100%;height:100%;object-fit:cover}
.ci-online{
  position:absolute;bottom:1px;right:1px;width:10px;height:10px;
  border-radius:50%;background:var(--green);border:2px solid var(--surface);
}
.ci-info{flex:1;min-width:0}
.ci-name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-last{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.ci-meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.ci-time{font-size:11px;color:var(--text3)}
.ci-badge{
  background:var(--accent);color:#fff;border-radius:50%;
  width:18px;height:18px;font-size:10px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}

/* MAIN AREA */
.main{flex:1;display:flex;flex-direction:column;min-width:0}

.chat-header{
  padding:14px 20px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;background:var(--surface);
  flex-shrink:0;
}
.ch-avatar{
  width:40px;height:40px;border-radius:50%;background:var(--accent);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;
  overflow:hidden;flex-shrink:0;cursor:pointer;
}
.ch-avatar img{width:100%;height:100%;object-fit:cover}
.ch-info{flex:1}
.ch-name{font-weight:700;font-size:15px}
.ch-status{font-size:12px;color:var(--green)}
.ch-actions{display:flex;gap:6px}

.messages-area{
  flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:8px;
  background:radial-gradient(ellipse at 50% 0%, rgba(124,106,247,0.04) 0%, transparent 70%), var(--bg);
}

.msg-row{display:flex;align-items:flex-end;gap:8px;max-width:70%;animation:msgIn .2s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg-row.out{align-self:flex-end;flex-direction:row-reverse}
.msg-row.in{align-self:flex-start}

.msg-avatar{
  width:28px;height:28px;border-radius:50%;background:var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;
  flex-shrink:0;overflow:hidden;
}
.msg-avatar img{width:100%;height:100%;object-fit:cover}

.msg-bubble{
  padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.5;
  word-break:break-word;max-width:100%;
}
.msg-row.out .msg-bubble{background:var(--msg-out);border-bottom-right-radius:4px}
.msg-row.in .msg-bubble{background:var(--msg-in);border-bottom-left-radius:4px;border:1px solid var(--border)}
.msg-time{font-size:10px;color:var(--text3);margin-top:4px;font-family:'JetBrains Mono',monospace}
.msg-row.out .msg-time{text-align:right}

.msg-img{max-width:240px;border-radius:12px;cursor:pointer;display:block}
.msg-video{max-width:280px;border-radius:12px;display:block}
.msg-file{
  display:flex;align-items:center;gap:8px;padding:10px 14px;
  background:var(--surface2);border-radius:12px;border:1px solid var(--border);
  font-size:13px;cursor:pointer;
}

/* voice message */
.msg-voice{
  display:flex;align-items:center;gap:10px;padding:8px 12px;
  background:var(--surface2);border-radius:30px;min-width:180px;
}
.voice-play{
  width:32px;height:32px;border-radius:50%;background:var(--accent);border:none;
  color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;
}
.voice-wave{flex:1;height:24px;display:flex;align-items:center;gap:2px}
.voice-bar{width:3px;border-radius:2px;background:var(--accent2);opacity:.6}

/* INPUT */
.input-area{
  padding:14px 16px;border-top:1px solid var(--border);background:var(--surface);
  display:flex;align-items:flex-end;gap:10px;flex-shrink:0;
}
.attach-menu{position:relative}
.attach-popup{
  position:absolute;bottom:44px;left:0;background:var(--surface2);border:1px solid var(--border);
  border-radius:14px;padding:8px;display:none;flex-direction:column;gap:4px;min-width:160px;
  box-shadow:0 10px 30px rgba(0,0,0,0.4);z-index:10;
}
.attach-popup.open{display:flex}
.attach-opt{
  display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;
  cursor:pointer;font-size:13px;font-weight:600;transition:background .15s;
}
.attach-opt:hover{background:var(--surface3)}
.msg-input{
  flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:14px;
  padding:11px 14px;color:var(--text);font-family:'Syne',sans-serif;font-size:14px;
  outline:none;resize:none;max-height:120px;line-height:1.4;transition:border-color .2s;
}
.msg-input:focus{border-color:var(--accent)}
.send-btn{
  width:44px;height:44px;border-radius:12px;background:var(--accent);border:none;
  color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:18px;transition:opacity .2s,transform .1s;flex-shrink:0;
}
.send-btn:hover{opacity:.9}
.send-btn:active{transform:scale(.95)}
.record-btn{
  width:44px;height:44px;border-radius:12px;background:var(--surface2);border:1px solid var(--border);
  color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:18px;transition:all .2s;flex-shrink:0;
}
.record-btn.recording{background:var(--red);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}

/* EMPTY STATE */
.empty-state{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;color:var(--text3);
}
.empty-state .big{font-size:64px}
.empty-state p{font-size:15px;font-weight:600}

/* MODALS */
.modal-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);
  display:none;align-items:center;justify-content:center;z-index:200;
}
.modal-bg.open{display:flex}
.modal{
  background:var(--surface);border:1px solid var(--border);border-radius:20px;
  padding:28px;width:380px;max-height:80vh;overflow-y:auto;
  box-shadow:0 30px 60px rgba(0,0,0,.5);
}
.modal h2{font-size:18px;font-weight:800;margin-bottom:20px}
.modal-close{
  float:right;background:none;border:none;color:var(--text2);font-size:20px;cursor:pointer;margin-top:-4px;
}
.user-result{
  display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;
  cursor:pointer;transition:background .15s;
}
.user-result:hover{background:var(--surface2)}
.ur-avatar{
  width:40px;height:40px;border-radius:50%;background:var(--accent);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;overflow:hidden;
}
.ur-avatar img{width:100%;height:100%;object-fit:cover}
.ur-name{font-weight:600;font-size:14px}
.ur-email{font-size:12px;color:var(--text2)}

/* PROFILE MODAL */
.profile-avatar-wrap{
  width:80px;height:80px;border-radius:50%;background:var(--accent);margin:0 auto 16px;
  display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700;
  cursor:pointer;overflow:hidden;border:3px solid var(--accent2);position:relative;
}
.profile-avatar-wrap img{width:100%;height:100%;object-fit:cover}
.profile-avatar-wrap::after{
  content:'📷';position:absolute;inset:0;background:rgba(0,0,0,.5);
  display:flex;align-items:center;justify-content:center;font-size:24px;
  opacity:0;transition:opacity .2s;border-radius:50%;
}
.profile-avatar-wrap:hover::after{opacity:1}

/* CALL SCREEN */
#callScreen{
  position:fixed;inset:0;background:#0a0a0f;z-index:300;
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px;
}
#callScreen.active{display:flex}
.call-avatar{
  width:100px;height:100px;border-radius:50%;background:var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:700;
  overflow:hidden;border:4px solid var(--accent2);
  box-shadow:0 0 60px rgba(124,106,247,.4);
}
.call-avatar img{width:100%;height:100%;object-fit:cover}
.call-name{font-size:24px;font-weight:800}
.call-status{color:var(--text2);font-size:14px}
.call-actions{display:flex;gap:20px;margin-top:20px}
.call-btn{
  width:64px;height:64px;border-radius:50%;border:none;
  cursor:pointer;font-size:24px;display:flex;align-items:center;justify-content:center;
  transition:transform .15s;
}
.call-btn:hover{transform:scale(1.1)}
.call-btn.end{background:var(--red)}
.call-btn.mute{background:var(--surface3)}
.call-btn.answer{background:var(--green)}

/* INCOMING CALL */
#incomingCallScreen{
  position:fixed;inset:0;background:rgba(10,10,15,.95);backdrop-filter:blur(10px);z-index:400;
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;
}
#incomingCallScreen.active{display:flex;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.incoming-avatar{
  width:96px;height:96px;border-radius:50%;background:var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:700;
  overflow:hidden;border:4px solid var(--accent2);animation:ringPulse 1.4s infinite;
}
.incoming-avatar img{width:100%;height:100%;object-fit:cover}
@keyframes ringPulse{0%,100%{box-shadow:0 0 0 0 rgba(124,106,247,.5)}50%{box-shadow:0 0 0 20px rgba(124,106,247,0)}}
.incoming-name{font-size:22px;font-weight:800}
.incoming-sub{color:var(--text2);font-size:13px}
.incoming-actions{display:flex;gap:28px;margin-top:14px}
.call-btn.decline{background:var(--red)}

/* VIDEO CALL */
#videoCallScreen{
  position:fixed;inset:0;background:#000;z-index:300;display:none;
}
#videoCallScreen.active{display:block}
#remoteVideo{width:100%;height:100%;object-fit:cover}
#localVideo{
  position:absolute;bottom:100px;right:20px;width:140px;height:100px;
  border-radius:12px;object-fit:cover;border:2px solid var(--accent);
}
.video-call-actions{
  position:absolute;bottom:30px;left:50%;transform:translateX(-50%);
  display:flex;gap:16px;
}

/* SCROLLBAR */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:2px}

/* GROUP BADGE */
.group-badge{
  background:var(--accent);color:#fff;font-size:9px;font-weight:700;
  padding:2px 5px;border-radius:4px;letter-spacing:.05em;
}

.divider{height:1px;background:var(--border);margin:8px 0}
.section-label{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;padding:8px 10px 4px}

input[type=file]{display:none}

/* GROUP AVATAR PREVIEW */
.group-avatar-preview{
  width:50px;height:50px;border-radius:50%;background:var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;
  overflow:hidden;flex-shrink:0;
}
.group-avatar-preview img{width:100%;height:100%;object-fit:cover}
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div id="authScreen">
  <div class="auth-card">
    <div class="auth-logo">Y<span>send</span></div>
    <div class="auth-sub">Мессенджер нового поколения</div>
    <div class="auth-tabs">
      <div class="auth-tab active" onclick="switchTab('login')">Войти</div>
      <div class="auth-tab" onclick="switchTab('register')">Создать аккаунт</div>
    </div>
    <div id="loginForm">
      <div class="field"><label>Email</label><input type="email" id="loginEmail" placeholder="you@example.com"/></div>
      <div class="field"><label>Пароль</label><input type="password" id="loginPass" placeholder="••••••••"/></div>
      <button class="btn-primary" onclick="doLogin()">Войти</button>
    </div>
    <div id="registerForm" style="display:none">
      <div class="field"><label>Имя</label><input type="text" id="regName" placeholder="Твоё имя"/></div>
      <div class="field"><label>Email</label><input type="email" id="regEmail" placeholder="you@example.com"/></div>
      <div class="field"><label>Пароль</label><input type="password" id="regPass" placeholder="Минимум 6 символов"/></div>
      <button class="btn-primary" onclick="doRegister()">Создать аккаунт</button>
    </div>
    <div class="auth-err" id="authErr"></div>
  </div>
</div>

<!-- MAIN APP -->
<div id="app">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-top">
      <div class="my-avatar" id="myAvatar" onclick="openProfile()">?</div>
      <div class="my-name" id="myName" onclick="openProfile()">...</div>
      <div class="sidebar-actions">
        <button class="icon-btn" onclick="openNewChat()" title="Новый чат">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </button>
        <button class="icon-btn" onclick="openNewGroup()" title="Создать группу">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        </button>
        <button class="icon-btn" onclick="doLogout()" title="Выйти">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </div>
    <div class="search-wrap">
      <div class="search-pill">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input class="search-input" placeholder="Поиск чатов..." oninput="filterChats(this.value)"/>
      </div>
    </div>
    <div class="chat-list" id="chatList"></div>
  </div>

  <!-- MAIN -->
  <div class="main" id="mainArea">
    <div class="empty-state" id="emptyState">
      <div class="big">💬</div>
      <p>Выбери чат или начни новый</p>
    </div>
    <div id="chatArea" style="display:none;flex-direction:column;height:100%">
      <div class="chat-header" id="chatHeader">
        <div class="ch-avatar" id="chAvatar" onclick="onAvatarClick()"></div>
        <div class="ch-info">
          <div class="ch-name" id="chName"></div>
          <div class="ch-status" id="chStatus"></div>
        </div>
        <div class="ch-actions">
          <button class="icon-btn" id="callBtn" onclick="startCall('audio')" title="Аудиозвонок">

<!-- FIREBASE SDK -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  signOut, onAuthStateChanged, updateProfile }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, getDoc, getDocs, addDoc,
  onSnapshot, query, where, orderBy, updateDoc, serverTimestamp, arrayUnion }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyB-yTlSlnozIhdpp-0vfAoZK92PHUMf_jU",
  authDomain: "ysend-e71e6.firebaseapp.com",
  projectId: "ysend-e71e6",
  storageBucket: "ysend-e71e6.appspot.com", // исправлено
  messagingSenderId: "78110029191",
  appId: "1:78110029191:web:6c4bdf3a40ee0664c6cf22"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

let currentUser = null;
let currentChatId = null;
let currentChatType = null; // 'direct' | 'group'
let currentChatData = null;
let messagesUnsub = null;
let chatsUnsub = null;
let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;
let localStream = null;
let peerConnection = null;
let selectedGroupMembers = [];
let isMuted = false;
let callType = null;
let groupAvatarFile = null; // для хранения файла аватарки при создании группы

// ───── AUTH ─────
window.switchTab = (tab) => {
  document.querySelectorAll('.auth-tab').forEach((t,i)=>t.classList.toggle('active', (i===0&&tab==='login')||(i===1&&tab==='register')));
  document.getElementById('loginForm').style.display = tab==='login'?'block':'none';
  document.getElementById('registerForm').style.display = tab==='register'?'block':'none';
  document.getElementById('authErr').textContent = '';
};

window.doLogin = async () => {
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  try {
    await signInWithEmailAndPassword(auth, email, pass);
  } catch(e) {
    document.getElementById('authErr').textContent = 'Неверный email или пароль';
  }
};

window.doRegister = async () => {
  const name = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const pass = document.getElementById('regPass').value;
  if(!name){document.getElementById('authErr').textContent='Введи имя';return}
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    await updateProfile(cred.user, {displayName: name});
    await setDoc(doc(db,'users',cred.user.uid), {
      uid: cred.user.uid, name, email, photoURL:'', createdAt: serverTimestamp()
    });
  } catch(e) {
    document.getElementById('authErr').textContent = e.message.includes('email') ? 'Email уже занят' : 'Пароль минимум 6 символов';
  }
};

window.doLogout = async () => {
  if(chatsUnsub) chatsUnsub();
  if(messagesUnsub) messagesUnsub();
  if(globalCallListenerUnsub) globalCallListenerUnsub();
  await signOut(auth);
};

onAuthStateChanged(auth, async (user) => {
  if(user) {
    currentUser = user;
    document.getElementById('authScreen').style.display = 'none';
    document.getElementById('app').classList.add('visible');
    await setDoc(doc(db,'users',user.uid), {online:true}, {merge:true});
    loadMyProfile();
    listenChats();
    listenIncomingCalls();
  } else {
    currentUser = null;
    document.getElementById('authScreen').style.display = 'flex';
    document.getElementById('app').classList.remove('visible');
  }
});

// ───── PROFILE ─────
async function loadMyProfile() {
  const snap = await getDoc(doc(db,'users',currentUser.uid));
  const data = snap.data() || {};
  const name = data.name || currentUser.displayName || 'Я';
  document.getElementById('myName').textContent = name;
  const av = document.getElementById('myAvatar');
  if(data.photoURL){av.innerHTML=`<img src="${data.photoURL}"/>`}
  else{av.textContent = name[0].toUpperCase()}
}

window.openProfile = async () => {
  const snap = await getDoc(doc(db,'users',currentUser.uid));
  const data = snap.data()||{};
  document.getElementById('profileName').value = data.name||currentUser.displayName||'';
  const wrap = document.getElementById('profileAvatarWrap');
  if(data.photoURL){wrap.innerHTML=`<img src="${data.photoURL}"/>`}
  else{wrap.textContent=(data.name||'?')[0].toUpperCase()}
  openModal('profileModal');
};

window.triggerAvatarUpload = () => document.getElementById('avatarInput').click();

window.uploadAvatar = async (input) => {
  if(!input.files[0]) return;
  const file = input.files[0];
  try {
    const r = ref(storage, `avatars/${currentUser.uid}`);
    await uploadBytes(r, file);
    const url = await getDownloadURL(r);
    await updateDoc(doc(db,'users',currentUser.uid), {photoURL:url});
    await updateProfile(currentUser, {photoURL:url});
    const wrap = document.getElementById('profileAvatarWrap');
    wrap.innerHTML = `<img src="${url}"/>`;
    loadMyProfile();
  } catch(e) {
    console.error('Upload avatar error:', e);
    alert('Ошибка загрузки аватарки: ' + (e.code || e.message));
  }
};

window.saveProfile = async () => {
  const name = document.getElementById('profileName').value.trim();
  if(!name) return;
  await updateDoc(doc(db,'users',currentUser.uid), {name});
  await updateProfile(currentUser, {displayName:name});
  document.getElementById('myName').textContent = name;
  closeModal('profileModal');
};

// ───── CHATS LIST ─────
function listenChats() {
  const q = query(collection(db,'chats'), where('members','array-contains',currentUser.uid));
  chatsUnsub = onSnapshot(q, snap => {
    const chats = [];
    snap.forEach(d => chats.push({id:d.id,...d.data()}));
    chats.sort((a,b)=>(b.lastTime?.seconds||0)-(a.lastTime?.seconds||0));
    renderChatList(chats);
  });
}

let chatListRenderGen = 0;
async function renderChatList(chats) {
  const myGen = ++chatListRenderGen;
  const list = document.getElementById('chatList');

  const items = await Promise.all(chats.map(async (chat) => {
    let name = '', photo = '', isOnline = false;
    if(chat.type==='group') {
      name = chat.name || 'Группа';
      photo = chat.photoURL || '';
    } else {
      const otherId = chat.members.find(m=>m!==currentUser.uid);
      if(otherId) {
        const uSnap = await getDoc(doc(db,'users',otherId));
        const ud = uSnap.data()||{};
        name = ud.name||'Пользователь';
        photo = ud.photoURL||'';
        isOnline = ud.online||false;
      }
    }
    return {chat, name, photo, isOnline};
  }));

  // отмена устаревшего рендера
  if(myGen !== chatListRenderGen) return;

  list.innerHTML = '';
  for(const {chat, name, photo, isOnline} of items) {
    const item = document.createElement('div');
    item.className = 'chat-item' + (chat.id===currentChatId?' active':'');
    item.setAttribute('data-chat-id', chat.id);
    item.onclick = () => openChat(chat);

    const initials = name[0]?.toUpperCase()||'?';
    item.innerHTML = `
      <div class="ci-avatar">
        ${photo?`<img src="${photo}"/>`:`<span>${initials}</span>`}
        ${isOnline?'<div class="ci-online"></div>':''}
      </div>
      <div class="ci-info">
        <div class="ci-name">${name} ${chat.type==='group'?'<span class="group-badge">GROUP</span>':''}</div>
        <div class="ci-last">${chat.lastMsg||''}</div>
      </div>
      <div class="ci-meta">
        <div class="ci-time">${formatTime(chat.lastTime)}</div>
      </div>`;
    list.appendChild(item);
  }
}

window.filterChats = (val) => {
  document.querySelectorAll('.chat-item').forEach(el => {
    const name = el.querySelector('.ci-name').textContent.toLowerCase();
    el.style.display = name.includes(val.toLowerCase()) ? '' : 'none';
  });
};

// ───── OPEN CHAT ─────
async function openChat(chat) {
  currentChatId = chat.id;
  currentChatData = chat;
  currentChatType = chat.type||'direct';

  document.getElementById('emptyState').style.display = 'none';
  const ca = document.getElementById('chatArea');
  ca.style.display = 'flex';

  // Update active state
  document.querySelectorAll('.chat-item').forEach(el => {
    el.classList.toggle('active', el.getAttribute('data-chat-id')===chat.id);
  });

  // Set header
  updateChatHeader(chat);

  // Listen messages
  if(messagesUnsub) messagesUnsub();
  const q = query(collection(db,'chats',chat.id,'messages'), orderBy('time','asc'));
  messagesUnsub = onSnapshot(q, snap => {
    renderMessages(snap.docs.map(d=>({id:d.id,...d.data()})));
  });
}

function updateChatHeader(chat) {
  let name='', photo='', status='';
  if(chat.type==='group') {
    name = chat.name||'Группа';
    status = `${chat.members.length} участников`;
    photo = chat.photoURL || '';
    document.getElementById('callBtn').style.display = 'none';
    document.getElementById('videoCallBtn').style.display = 'none';
    document.getElementById('chAvatar').style.cursor = 'pointer';
  } else {
    const otherId = chat.members.find(m=>m!==currentUser.uid);
    if(otherId) {
      getDoc(doc(db,'users',otherId)).then(snap => {
        const ud = snap.data()||{};
        const newName = ud.name||'Пользователь';
        const newPhoto = ud.photoURL||'';
        const newStatus = ud.online ? '● В сети' : 'Не в сети';
        document.getElementById('chName').textContent = newName;
        document.getElementById('chStatus').textContent = newStatus;
        const chAv = document.getElementById('chAvatar');
        chAv.innerHTML = newPhoto ? `<img src="${newPhoto}"/>` : (newName[0]?.toUpperCase()||'?');
      });
    }
    document.getElementById('callBtn').style.display = '';
    document.getElementById('videoCallBtn').style.display = '';
    document.getElementById('chAvatar').style.cursor = 'default';
    // для синхронного отображения пока используем старые данные
    const otherIdSync = chat.members.find(m=>m!==currentUser.uid);
    if(otherIdSync) {
      getDoc(doc(db,'users',otherIdSync)).then(snap => {
        const ud = snap.data()||{};
        const newName = ud.name||'Пользователь';
        const newPhoto = ud.photoURL||'';
        const newStatus = ud.online ? '● В сети' : 'Не в сети';
        document.getElementById('chName').textContent = newName;
        document.getElementById('chStatus').textContent = newStatus;
        const chAv = document.getElementById('chAvatar');
        chAv.innerHTML = newPhoto ? `<img src="${newPhoto}"/>` : (newName[0]?.toUpperCase()||'?');
      });
    }
    return;
  }

  document.getElementById('chName').textContent = name;
  document.getElementById('chStatus').textContent = status;
  const chAv = document.getElementById('chAvatar');
  chAv.innerHTML = photo ? `<img src="${photo}"/>` : (name[0]?.toUpperCase()||'?');
}

// ───── MESSAGES ─────
async function renderMessages(msgs) {
  const area = document.getElementById('messagesArea');
  area.innerHTML = '';

  const userCache = {};
  for(const msg of msgs) {
    if(msg.sender && !userCache[msg.sender]) {
      const snap = await getDoc(doc(db,'users',msg.sender));
      userCache[msg.sender] = snap.data()||{};
    }
  }

  for(const msg of msgs) {
    const isOut = msg.sender === currentUser.uid;
    const ud = userCache[msg.sender]||{};
    const row = document.createElement('div');
    row.className = `msg-row ${isOut?'out':'in'}`;

    let content = '';
    if(msg.type==='text') content = `<div class="msg-bubble">${escapeHtml(msg.text)}</div>`;
    else if(msg.type==='image') content = `<div class="msg-bubble" style="padding:4px"><img class="msg-img" src="${msg.url}" onclick="window.open('${msg.url}')"/></div>`;
    else if(msg.type==='video') content = `<div class="msg-bubble" style="padding:4px"><video class="msg-video" controls src="${msg.url}"></video></div>`;
    else if(msg.type==='voice') content = renderVoice(msg.url);
    else if(msg.type==='file') content = `<div class="msg-file" onclick="window.open('${msg.url}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><span>${msg.fileName||'Файл'}</span></div>`;

    row.innerHTML = `
      ${!isOut?`<div class="msg-avatar">${ud.photoURL?`<img src="${ud.photoURL}"/>`:(ud.name||'?')[0].toUpperCase()}</div>`:''}
      <div>
        ${!isOut&&currentChatType==='group'?`<div style="font-size:11px;color:var(--accent2);margin-bottom:4px;font-weight:600">${ud.name||'?'}</div>`:''}
        ${content}
        <div class="msg-time">${formatTime(msg.time)}</div>
      </div>`;
    area.appendChild(row);
  }
  area.scrollTop = area.scrollHeight;
}

function renderVoice(url) {
  const id = 'v'+Math.random().toString(36).slice(2);
  const bars = Array.from({length:20},(_,i)=>`<div class="voice-bar" style="height:${8+Math.sin(i*.8)*8}px"></div>`).join('');
  return `<div class="msg-voice">
    <button class="voice-play" onclick="playVoice('${url}','${id}')" id="${id}_btn">
      <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
    </button>
    <div class="voice-wave">${bars}</div>
    <audio id="${id}" src="${url}"></audio>
  </div>`;
}

window.playVoice = (url, id) => {
  const a = document.getElementById(id);
  const btn = document.getElementById(id+'_btn');
  if(a.paused){
    a.play();
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>';
    a.onended = () => { btn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>'; };
  } else {
    a.pause();

  }
};

window.toggleRecord = async () => {
  if(!isRecording) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];
      mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
      mediaRecorder.onstop = async () => {
        const blob = new Blob(audioChunks, {type:'audio/webm'});
        stream.getTracks().forEach(t=>t.stop());
        if(!currentChatId) return;
        try {
          const r = ref(storage, `chats/${currentChatId}/voice_${Date.now()}.webm`);
          await uploadBytes(r, blob);
          const url = await getDownloadURL(r);
          await addDoc(collection(db,'chats',currentChatId,'messages'), {
            type:'voice', url, sender:currentUser.uid, time:serverTimestamp()
          });
          await updateDoc(doc(db,'chats',currentChatId), {lastMsg:'Голосовое сообщение', lastTime:serverTimestamp()});
        } catch(e) {
          console.error('Upload voice error:', e);
          alert('Не удалось загрузить голосовое: ' + (e.code || e.message) + '\nПроверь, что Firebase Storage включён и проект на плане Blaze.');
        }
      };
      mediaRecorder.start();
      isRecording = true;
      document.getElementById('recordBtn').classList.add('recording');
      document.getElementById('recordBtn').innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>';
    } catch(e) { alert('Нет доступа к микрофону'); }
  } else {
    mediaRecorder.stop();
    isRecording = false;
    document.getElementById('recordBtn').classList.remove('recording');
    document.getElementById('recordBtn').innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>';
  }
};

// ───── CALLS (WebRTC) ─────
const iceConfig = {iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]};
let activeCallChatId = null;
let isCaller = false;
let candidatesUnsub = null;
let callDocUnsub = null;
let globalCallListenerUnsub = null;
let ringtoneTimeout = null;

function listenIncomingCalls() {
  const q = query(collection(db,'calls'), where('calleeId','==',currentUser.uid));
  globalCallListenerUnsub = onSnapshot(q, snap => {
    snap.docChanges().forEach(change => {
      const data = change.doc.data();
      const chatId = change.doc.id;
      if(change.type !== 'removed' && data.status === 'ringing' && chatId !== activeCallChatId) {
        showIncomingCall(chatId, data);
      }
      if(data.status === 'ended' && chatId === activeCallChatId) {
        cleanupCall();
      }
    });
  });
}

async function showIncomingCall(chatId, data) {
  activeCallChatId = chatId;
  callType = data.callType;
  isCaller = false;
  const uSnap = await getDoc(doc(db,'users',data.callerId));
  const ud = uSnap.data()||{};
  document.getElementById('incomingAvatar').innerHTML = ud.photoURL?`<img src="${ud.photoURL}"/>`:(ud.name||'?')[0].toUpperCase();
  document.getElementById('incomingName').textContent = ud.name||'Пользователь';
  document.getElementById('incomingSub').textContent = data.callType==='video' ? 'Входящий видеозвонок...' : 'Входящий звонок...';
  document.getElementById('incomingCallScreen').classList.add('active');

  callDocUnsub = onSnapshot(doc(db,'calls',chatId), s => {
    const d = s.data();
    if(!d || d.status==='ended' || d.status==='cancelled') {
      document.getElementById('incomingCallScreen').classList.remove('active');
      if(callDocUnsub) { callDocUnsub(); callDocUnsub=null; }
      activeCallChatId = null;
    }
  });
}

window.declineCall = async () => {
  if(activeCallChatId) {
    await updateDoc(doc(db,'calls',activeCallChatId), {status:'ended'});
  }
  document.getElementById('incomingCallScreen').classList.remove('active');
  if(callDocUnsub) { callDocUnsub(); callDocUnsub=null; }
  activeCallChatId = null;
};

window.answerCall = async () => {
  document.getElementById('incomingCallScreen').classList.remove('active');
  if(callDocUnsub) { callDocUnsub(); callDocUnsub=null; }

  const chatId = activeCallChatId;
  const callSnap = await getDoc(doc(db,'calls',chatId));
  const callData = callSnap.data();
  if(!callData) return;

  if(callType==='video') document.getElementById('videoCallScreen').classList.add('active');
  else {
    document.getElementById('callScreen').classList.add('active');
    const uSnap = await getDoc(doc(db,'users',callData.callerId));
    const ud = uSnap.data()||{};
    document.getElementById('callAvatar').innerHTML = ud.photoURL?`<img src="${ud.photoURL}"/>`:(ud.name||'?')[0].toUpperCase();
    document.getElementById('callName').textContent = ud.name||'?';
    document.getElementById('callStatus').textContent = 'Соединение...';
  }

  try {
    localStream = await navigator.mediaDevices.getUserMedia(
      callType==='video' ? {video:true,audio:true} : {audio:true}
    );
    if(callType==='video') document.getElementById('localVideo').srcObject = localStream;
  } catch(e) { alert('Нет доступа к камере/микрофону'); cleanupCall(); return; }

  peerConnection = new RTCPeerConnection(iceConfig);
  localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));
  peerConnection.ontrack = e => {
    if(callType==='video') document.getElementById('remoteVideo').srcObject = e.streams[0];
    else document.getElementById('callStatus').textContent = 'Соединено';
  };
  peerConnection.onicecandidate = e => {
    if(e.candidate) addDoc(collection(db,'calls',chatId,'calleeCandidates'), e.candidate.toJSON());
  };

  await peerConnection.setRemoteDescription(new RTCSessionDescription(callData.offer));
  const answer = await peerConnection.createAnswer();
  await peerConnection.setLocalDescription(answer);
  await updateDoc(doc(db,'calls',chatId), {answer:{type:answer.type,sdp:answer.sdp}, status:'accepted'});

  candidatesUnsub = onSnapshot(collection(db,'calls',chatId,'callerCandidates'), snap => {
    snap.docChanges().forEach(c => {
      if(c.type==='added' && peerConnection) peerConnection.addIceCandidate(new RTCIceCandidate(c.doc.data()));
    });
  });

  watchCallEnd(chatId);
};

function watchCallEnd(chatId) {
  callDocUnsub = onSnapshot(doc(db,'calls',chatId), s => {
    const d = s.data();
    if(!d || d.status==='ended') cleanupCall();
  });
}

window.startCall = async (type) => {
  if(!currentChatData || currentChatType!=='direct') return;
  callType = type;
  isCaller = true;
  const otherId = currentChatData.members.find(m=>m!==currentUser.uid);
  const chatId = currentChatId;
  activeCallChatId = chatId;
  const uSnap = await getDoc(doc(db,'users',otherId));
  const ud = uSnap.data()||{};

  if(type==='video') {
    document.getElementById('videoCallScreen').classList.add('active');
  } else {
    document.getElementById('callScreen').classList.add('active');
    const av = document.getElementById('callAvatar');
    av.innerHTML = ud.photoURL?`<img src="${ud.photoURL}"/>`:(ud.name||'?')[0].toUpperCase();
    document.getElementById('callName').textContent = ud.name||'?';
    document.getElementById('callStatus').textContent = 'Вызов...';
  }

  try {
    localStream = await navigator.mediaDevices.getUserMedia(
      type==='video' ? {video:true,audio:true} : {audio:true}
    );
    if(type==='video') document.getElementById('localVideo').srcObject = localStream;
  } catch(e) { alert('Нет доступа к камере/микрофону'); cleanupCall(); return; }

  peerConnection = new RTCPeerConnection(iceConfig);
  localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));
  peerConnection.ontrack = e => {
    if(type==='video') document.getElementById('remoteVideo').srcObject = e.streams[0];
    else document.getElementById('callStatus').textContent = 'Соединено';
  };
  peerConnection.onicecandidate = e => {
    if(e.candidate) addDoc(collection(db,'calls',chatId,'callerCandidates'), e.candidate.toJSON());
  };

  const offer = await peerConnection.createOffer();
  await peerConnection.setLocalDescription(offer);

  await setDoc(doc(db,'calls',chatId), {
    offer:{type:offer.type,sdp:offer.sdp},
    callerId:currentUser.uid,
    calleeId:otherId,
    callType:type,
    status:'ringing'
  });

  callDocUnsub = onSnapshot(doc(db,'calls',chatId), async snap => {
    const data = snap.data();
    if(!data) return;
    if(data.answer && peerConnection && peerConnection.signalingState==='have-local-offer') {
      await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
      if(type==='audio') document.getElementById('callStatus').textContent = 'Соединено';
    }
    if(data.status==='ended') cleanupCall();
  });

  candidatesUnsub = onSnapshot(collection(db,'calls',chatId,'calleeCandidates'), snap => {
    snap.docChanges().forEach(c => {
      if(c.type==='added' && peerConnection) peerConnection.addIceCandidate(new RTCIceCandidate(c.doc.data()));
    });
  });
};

window.endCall = async () => {
  if(activeCallChatId) {
    try { await updateDoc(doc(db,'calls',activeCallChatId), {status:'ended'}); } catch(e){}
  }
  cleanupCall();
};

function cleanupCall() {
  if(peerConnection) { peerConnection.close(); peerConnection = null; }
  if(localStream) { localStream.getTracks().forEach(t=>t.stop()); localStream=null; }
  if(candidatesUnsub) { candidatesUnsub(); candidatesUnsub=null; }
  if(callDocUnsub) { callDocUnsub(); callDocUnsub=null; }
  document.getElementById('callScreen').classList.remove('active');
  document.getElementById('videoCallScreen').classList.remove('active');
  document.getElementById('incomingCallScreen').classList.remove('active');
  activeCallChatId = null;
  isCaller = false;
  isMuted = false;
}

    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="1" y1="1" x2="23" y2="23"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"/><path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>';
  ['muteBtn1','muteBtn2'].forEach(id=>{const el=document.getElementById(id); if(el) el.innerHTML=icon;});
};

// ───── MODALS ─────
window.openModal = (id) => document.getElementById(id).classList.add('open');
window.closeModal = (id) => document.getElementById(id).classList.remove('open');
document.querySelectorAll('.modal-bg').forEach(bg => {
  bg.addEventListener('click', e => { if(e.target===bg) bg.classList.remove('open'); });
});

// ───── ATTACH ─────
window.toggleAttach = () => document.getElementById('attachPopup').classList.toggle('open');
window.closeAttach = () => document.getElementById('attachPopup').classList.remove('open');
document.addEventListener('click', e => {
  if(!e.target.closest('.attach-menu')) closeAttach();
});

// ───── UTILS ─────
function formatTime(ts) {
  if(!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts.seconds*1000);
  const now = new Date();
  if(d.toDateString()===now.toDateString()) return d.toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});
  return d.toLocaleDateString('ru',{day:'2-digit',month:'2-digit'});
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

</script>

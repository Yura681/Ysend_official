<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ysend - Групповые звонки</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg0:#07070e;--bg1:#0e0e1a;--bg2:#141421;--bg3:#1c1c2e;--bg4:#242438;
  --acc:#7c6bff;--acc2:#a99cff;--acc3:#5546e8;
  --teal:#00d4b4;--red:#ff5f6d;--yellow:#ffd166;--green:#06d6a0;
  --txt:#eeeeff;--txt2:#9090b8;--txt3:#5a5a80;
  --border:rgba(124,107,255,0.12);--border2:rgba(255,255,255,0.06);
  --glow:0 0 40px rgba(124,107,255,0.2);
  --r:16px;
}
body{background:var(--bg0);color:var(--txt);font-family:'Outfit',sans-serif;height:100vh;overflow:hidden;display:flex}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:2px}

/* AMBIENT BACKGROUND */
.ambient{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.amb-orb{position:absolute;border-radius:50%;filter:blur(100px);opacity:0.07}
.amb1{width:600px;height:600px;background:var(--acc);top:-200px;left:-200px;animation:drift1 20s ease-in-out infinite}
.amb2{width:500px;height:500px;background:var(--teal);bottom:-150px;right:-150px;animation:drift2 25s ease-in-out infinite}
.amb3{width:300px;height:300px;background:var(--red);top:50%;left:50%;animation:drift3 18s ease-in-out infinite}
@keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,40px)}}
@keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-40px,-60px)}}
@keyframes drift3{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.3)}}

/* AUTH */
#authScreen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:100}
.auth-card{
  background:rgba(14,14,26,0.8);backdrop-filter:blur(24px);
  border:1px solid var(--border);border-radius:28px;
  padding:52px 44px;width:440px;max-width:94vw;
  box-shadow:0 32px 80px rgba(0,0,0,0.6),var(--glow);
  animation:slideUp .5s ease
}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.auth-logo{
  width:72px;height:72px;
  background:linear-gradient(135deg,var(--acc),var(--teal));
  border-radius:22px;margin:0 auto 20px;
  display:flex;align-items:center;justify-content:center;
  font-size:2.2rem;font-weight:800;
  box-shadow:0 8px 32px rgba(124,107,255,0.5);
  animation:logoFloat 3s ease-in-out infinite
}
@keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.auth-title{text-align:center;font-size:1.8rem;font-weight:800;letter-spacing:-0.5px;margin-bottom:6px;
  background:linear-gradient(135deg,#fff,var(--acc2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.auth-sub{text-align:center;color:var(--txt2);font-size:.9rem;margin-bottom:28px}
.auth-tabs{display:flex;gap:4px;background:var(--bg3);border-radius:14px;padding:4px;margin-bottom:24px}
.auth-tab{flex:1;padding:11px;border:none;background:transparent;color:var(--txt2);border-radius:10px;
  cursor:pointer;font-family:'Outfit',sans-serif;font-size:.9rem;font-weight:500;transition:all .2s}
.auth-tab.active{background:var(--acc);color:#fff;box-shadow:0 4px 12px rgba(124,107,255,.4)}
.auth-input{
  width:100%;padding:13px 16px;background:var(--bg3);
  border:1px solid var(--border2);border-radius:12px;
  color:var(--txt);font-family:'Outfit',sans-serif;font-size:.95rem;
  outline:none;margin-bottom:14px;transition:border-color .2s
}
.auth-input:focus{border-color:var(--acc)}
.auth-btn{
  width:100%;padding:14px;background:linear-gradient(135deg,var(--acc),var(--acc3));
  border:none;border-radius:12px;color:#fff;font-family:'Outfit',sans-serif;
  font-size:1rem;font-weight:700;cursor:pointer;transition:all .2s;letter-spacing:.3px
}
.auth-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(124,107,255,.5)}
.auth-error{color:var(--red);font-size:.82rem;text-align:center;margin-top:14px;min-height:18px}

/* MAIN APP */
#mainApp{display:none;flex:1;position:relative;z-index:1}
#mainApp.active{display:flex}

/* SIDEBAR */
.sidebar{
  width:340px;min-width:340px;background:rgba(10,10,20,0.7);backdrop-filter:blur(20px);
  border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;
  transition:transform .3s ease
}
.sidebar-header{padding:20px 20px 0;flex-shrink:0}
.sidebar-brand{
  display:flex;align-items:center;gap:10px;margin-bottom:18px;
  font-size:1.4rem;font-weight:800;letter-spacing:-.5px;
  background:linear-gradient(135deg,var(--acc2),var(--teal));-webkit-background-clip:text;-webkit-text-fill-color:transparent
}
.brand-icon{width:34px;height:34px;background:linear-gradient(135deg,var(--acc),var(--teal));
  border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;
  box-shadow:0 4px 12px rgba(124,107,255,.4)}
.search-wrap{position:relative;margin-bottom:14px}
.search-wrap i{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--txt3);font-size:13px}
.search-wrap input{
  width:100%;padding:11px 14px 11px 38px;background:var(--bg3);
  border:1px solid var(--border2);border-radius:12px;
  color:var(--txt);font-family:'Outfit',sans-serif;font-size:.88rem;outline:none;transition:border-color .2s
}
.search-wrap input:focus{border-color:var(--acc)}
.sidebar-tabs{display:flex;gap:4px;padding:0 20px 10px;border-bottom:1px solid var(--border2)}
.s-tab{flex:1;padding:9px;border:none;background:transparent;color:var(--txt2);
  border-radius:10px;cursor:pointer;font-family:'Outfit',sans-serif;font-size:.82rem;
  font-weight:500;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:6px}
.s-tab.active{background:rgba(124,107,255,.15);color:var(--acc2)}
.s-tab:hover:not(.active){background:rgba(255,255,255,.04);color:var(--txt)}
.chat-list{flex:1;overflow-y:auto;padding:6px 8px}
.chat-item{
  display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;
  cursor:pointer;transition:all .15s;position:relative
}
.chat-item:hover{background:rgba(255,255,255,.04)}
.chat-item.active{background:rgba(124,107,255,.12);border:1px solid rgba(124,107,255,.2)}
.av{
  width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--teal));
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.1rem;
  flex-shrink:0;overflow:hidden;position:relative
}
.av img{width:100%;height:100%;object-fit:cover}
.av .dot{position:absolute;bottom:1px;right:1px;width:11px;height:11px;
  background:var(--green);border-radius:50%;border:2px solid var(--bg1)}
.ci{flex:1;min-width:0}
.ci-name{font-size:.9rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  display:flex;align-items:center;gap:6px}
.ci-last{font-size:.78rem;color:var(--txt2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.ci-meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.ci-time{font-size:.72rem;color:var(--txt3)}
.unread{
  background:linear-gradient(135deg,var(--acc),var(--teal));color:#fff;
  font-size:.68rem;font-weight:700;border-radius:20px;min-width:20px;height:20px;
  display:flex;align-items:center;justify-content:center;padding:0 6px
}
.grp-badge{font-size:.68rem;background:rgba(0,212,180,.15);color:var(--teal);
  padding:1px 6px;border-radius:5px;border:1px solid rgba(0,212,180,.2);font-weight:600}

/* SIDEBAR BOTTOM */
.sb-bottom{padding:14px 16px;border-top:1px solid var(--border2);flex-shrink:0}
.my-profile{
  display:flex;align-items:center;gap:11px;padding:10px;border-radius:14px;
  cursor:pointer;transition:background .15s;margin-bottom:8px
}
.my-profile:hover{background:rgba(255,255,255,.04)}
.my-profile-info{flex:1;min-width:0}
.my-profile-name{font-weight:600;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.my-profile-role{font-size:.73rem;color:var(--acc2);margin-top:1px}
.sb-actions{display:flex;gap:7px}
.ib{
  width:34px;height:34px;background:var(--bg3);border:1px solid var(--border2);
  border-radius:10px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .15s;color:var(--txt2);font-size:14px
}
.ib:hover{background:var(--acc);color:#fff;border-color:var(--acc);box-shadow:0 4px 12px rgba(124,107,255,.3)}
.new-chat-btn{
  width:100%;padding:11px;background:rgba(124,107,255,.1);
  border:1px solid rgba(124,107,255,.2);border-radius:12px;
  color:var(--acc2);cursor:pointer;font-family:'Outfit',sans-serif;font-size:.88rem;font-weight:500;
  display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s
}
.new-chat-btn:hover{background:rgba(124,107,255,.18);border-color:rgba(124,107,255,.4)}

/* CHAT AREA */
.chat-area{flex:1;display:flex;flex-direction:column;background:var(--bg0);overflow:hidden;position:relative}
.no-chat{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;color:var(--txt3)
}
.no-chat-logo{
  font-size:3.5rem;font-weight:800;
  background:linear-gradient(135deg,var(--acc2),var(--teal));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px
}
.chat-header{
  padding:14px 22px;background:rgba(10,10,20,0.8);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border2);display:flex;align-items:center;gap:14px;flex-shrink:0
}
.ch-info{flex:1}
.ch-title{font-weight:700;font-size:1rem;letter-spacing:-.2px}
.ch-status{font-size:.76rem;color:var(--txt2);margin-top:2px}
.ch-actions{display:flex;gap:8px}
.call-btn{
  padding:8px 16px;border:none;border-radius:10px;cursor:pointer;
  font-family:'Outfit',sans-serif;font-size:.82rem;font-weight:600;
  display:flex;align-items:center;gap:7px;transition:all .2s
}
.call-btn.voice{background:rgba(6,214,160,.12);color:var(--green);border:1px solid rgba(6,214,160,.25)}
.call-btn.voice:hover{background:rgba(6,214,160,.2);box-shadow:0 4px 14px rgba(6,214,160,.2)}
.call-btn.video{background:rgba(0,212,180,.1);color:var(--teal);border:1px solid rgba(0,212,180,.2)}
.call-btn.video:hover{background:rgba(0,212,180,.18)}

/* MESSAGES */
.messages{flex:1;overflow-y:auto;padding:18px 22px;display:flex;flex-direction:column;gap:4px}
.day-sep{
  text-align:center;color:var(--txt3);font-size:.72rem;margin:12px 0 6px;
  display:flex;align-items:center;gap:10px
}
.day-sep::before,.day-sep::after{content:'';flex:1;height:1px;background:var(--border2)}
.msg-row{display:flex;gap:9px;align-items:flex-end;margin:1px 0;animation:msgIn .2s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg-row.mine{flex-direction:row-reverse}
.msg-row .av{width:30px;height:30px;font-size:.78rem;flex-shrink:0}
.msg-bub{max-width:66%}
.msg-row.mine .msg-bub{align-items:flex-end;display:flex;flex-direction:column}
.bubble{
  padding:10px 14px;border-radius:18px;background:var(--bg3);
  color:var(--txt);font-size:.9rem;line-height:1.5;word-break:break-word
}
.msg-row.mine .bubble{
  background:linear-gradient(135deg,var(--acc),var(--acc3));
  border-bottom-right-radius:4px
}
.msg-row:not(.mine) .bubble{border-bottom-left-radius:4px}
.sender-nm{font-size:.72rem;color:var(--acc2);font-weight:700;margin-bottom:4px}
.msg-ts{font-size:.68rem;color:var(--txt3);margin-top:3px;padding:0 4px}
.msg-row.mine .msg-ts{text-align:right}
.msg-img{max-width:260px;max-height:200px;border-radius:12px;display:block;cursor:pointer;object-fit:cover}
.msg-video{max-width:260px;border-radius:12px;display:block}
.voice-msg{
  display:flex;align-items:center;gap:10px;padding:10px 14px;
  background:var(--bg3);border-radius:18px;cursor:pointer;min-width:190px
}
.msg-row.mine .voice-msg{background:linear-gradient(135deg,var(--acc),var(--acc3))}
.vp-btn{
  width:36px;height:36px;background:rgba(255,255,255,.15);border-radius:50%;
  display:flex;align-items:center;justify-content:center;flex-shrink:0
}
.vw{flex:1;height:28px;display:flex;align-items:center;gap:2px}
.vb{width:3px;border-radius:2px;background:rgba(255,255,255,.35);transition:height .08s}
.v-dur{font-size:.73rem;color:var(--txt2);min-width:32px}
.msg-row.mine .v-dur{color:rgba(255,255,255,.7)}
.sys-msg{
  text-align:center;font-size:.74rem;color:var(--txt3);padding:4px 14px;
  background:rgba(255,255,255,.04);border-radius:20px;width:fit-content;margin:6px auto
}

/* INPUT AREA */
.input-area{padding:14px 22px;background:rgba(10,10,20,.8);backdrop-filter:blur(20px);border-top:1px solid var(--border2);flex-shrink:0}
.media-prev{display:none;align-items:center;gap:10px;padding:8px 12px;
  background:var(--bg3);border:1px solid var(--border2);border-radius:12px;margin-bottom:10px}
.media-prev.show{display:flex}
.mp-thumb{width:46px;height:46px;border-radius:8px;object-fit:cover}
.mp-name{flex:1;font-size:.82rem;color:var(--txt2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mp-rm{background:none;border:none;color:var(--txt3);cursor:pointer;font-size:16px;padding:4px}
.mp-rm:hover{color:var(--red)}
.rec-bar{display:none;align-items:center;gap:10px;padding:9px 14px;
  background:rgba(255,95,109,.08);border:1px solid rgba(255,95,109,.2);
  border-radius:12px;margin-bottom:10px;font-size:.88rem;color:var(--red)}
.rec-bar.show{display:flex}
.rec-dot{width:9px;height:9px;background:var(--red);border-radius:50%;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.input-row{
  display:flex;align-items:flex-end;gap:8px;background:var(--bg3);
  border:1px solid var(--border2);border-radius:20px;padding:8px 8px 8px 16px;transition:border-color .2s
}
.input-row:focus-within{border-color:rgba(124,107,255,.4)}
#msgInput{
  flex:1;background:transparent;border:none;outline:none;color:var(--txt);
  font-family:'Outfit',sans-serif;font-size:.9rem;resize:none;max-height:110px;line-height:1.5;padding:5px 0
}
#msgInput::placeholder{color:var(--txt3)}
.inp-btn{
  width:38px;height:38px;background:transparent;border:none;cursor:pointer;
  color:var(--txt2);font-size:15px;display:flex;align-items:center;justify-content:center;
  border-radius:10px;transition:all .15s;flex-shrink:0
}
.inp-btn:hover{background:var(--bg4);color:var(--txt)}
.inp-btn.rec-active{color:var(--red)}
.send-btn{
  width:38px;height:38px;background:linear-gradient(135deg,var(--acc),var(--acc3));border:none;
  cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center;
  border-radius:12px;transition:all .2s;flex-shrink:0
}
.send-btn:hover{transform:scale(1.08);box-shadow:0 4px 14px rgba(124,107,255,.5)}

/* EMOJI PANEL */
.emoji-panel{
  display:none;padding:12px;background:var(--bg2);border:1px solid var(--border);
  border-radius:16px;margin-bottom:10px;flex-wrap:wrap;gap:4px;
  box-shadow:0 8px 24px rgba(0,0,0,.4)
}
.emoji-panel.show{display:flex}
.emoji-btn{font-size:1.3rem;padding:4px;cursor:pointer;border-radius:6px;
  border:none;background:transparent;transition:transform .1s}
.emoji-btn:hover{transform:scale(1.2)}

/* CALL OVERLAY (групповой звонок) */
#callOverlay{
  position:fixed;inset:0;background:rgba(4,4,14,.96);backdrop-filter:blur(30px);
  z-index:900;display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px
}
#callOverlay.active{display:flex}
.call-av{
  width:110px;height:110px;border-radius:50%;
  background:linear-gradient(135deg,var(--acc),var(--teal));
  display:flex;align-items:center;justify-content:center;
  font-size:2.8rem;font-weight:700;overflow:hidden;
  box-shadow:0 0 0 0 rgba(124,107,255,.5);animation:callPulse 2s ease-in-out infinite
}
@keyframes callPulse{0%{box-shadow:0 0 0 0 rgba(124,107,255,.4)}70%{box-shadow:0 0 0 30px rgba(124,107,255,0)}100%{box-shadow:0 0 0 0 rgba(124,107,255,0)}}
.call-av.connected{animation:none;box-shadow:0 0 40px rgba(6,214,160,.4)}
.call-nm{font-size:1.6rem;font-weight:800;letter-spacing:-.5px}
.call-st{color:var(--txt2);font-size:.9rem;margin-top:4px}
.call-tm{font-family:'JetBrains Mono',monospace;font-size:1.3rem;color:var(--green);font-weight:500;display:none}
.call-participants{
  display:flex;flex-wrap:wrap;justify-content:center;gap:16px;max-width:500px;margin-top:20px;
  max-height:200px;overflow-y:auto;padding:8px
}
.participant{
  display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 12px;
  background:var(--bg3);border-radius:16px;min-width:90px
}
.participant-av{
  width:48px;height:48px;border-radius:50%;background:var(--bg4);
  display:flex;align-items:center;justify-content:center;font-size:1rem;font-weight:600
}
.participant-name{font-size:.75rem;color:var(--txt2);text-align:center}
.call-ctrls{display:flex;gap:20px;margin-top:16px}
.c-btn{
  width:62px;height:62px;border-radius:50%;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:1.4rem;
  transition:all .2s;color:#fff
}
.c-btn:hover{transform:scale(1.1)}
.c-btn.mute{background:var(--bg4)}
.c-btn.muted{background:rgba(255,95,109,.3)!important;color:var(--red)}
.c-btn.end{background:linear-gradient(135deg,var(--red),#d44);box-shadow:0 4px 20px rgba(255,95,109,.4)}
.c-btn.end:hover{box-shadow:0 6px 28px rgba(255,95,109,.6)}
.c-btn.speaker{background:var(--bg4)}
.call-waves{display:flex;align-items:center;gap:3px;height:36px;margin:10px 0}
.cw{width:3px;background:var(--acc2);border-radius:2px;animation:waveUp 1s ease-in-out infinite}
.cw:nth-child(2){animation-delay:.1s}.cw:nth-child(3){animation-delay:.2s}.cw:nth-child(4){animation-delay:.3s}.cw:nth-child(5){animation-delay:.4s}
@keyframes waveUp{0%,100%{height:6px}50%{height:28px}}
.call-active-waves{display:none}
.call-active-waves.show{display:flex}

/* INCOMING CALL */
.incoming-call{
  position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
  background:rgba(14,14,26,.95);backdrop-filter:blur(20px);
  border:1px solid rgba(124,107,255,.4);border-radius:20px;padding:16px 22px;
  display:flex;align-items:center;gap:18px;z-index:1500;
  box-shadow:0 16px 48px rgba(0,0,0,.5),var(--glow);
  animation:slideUp .3s ease
}
.ic-info{display:flex;align-items:center;gap:12px}
.ic-btns{display:flex;gap:10px;margin-left:8px}
.ic-btn{width:46px;height:46px;border-radius:50%;border:none;cursor:pointer;font-size:1.1rem;transition:all .2s}
.ic-btn.ans{background:linear-gradient(135deg,var(--green),#04b882);color:#fff;box-shadow:0 4px 14px rgba(6,214,160,.4)}
.ic-btn.dec{background:linear-gradient(135deg,var(--red),#d44);color:#fff;box-shadow:0 4px 14px rgba(255,95,109,.3)}
.ic-btn:hover{transform:scale(1.1)}

/* MODALS */
.modal{
  position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);
  display:none;align-items:center;justify-content:center;z-index:800
}
.modal.active{display:flex}
.modal-card{
  background:var(--bg1);border:1px solid var(--border);border-radius:24px;
  padding:30px;width:480px;max-width:94vw;max-height:88vh;overflow-y:auto;
  box-shadow:0 24px 64px rgba(0,0,0,.6)
}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.mh h2{font-size:1.2rem;font-weight:700}
.mc{width:32px;height:32px;background:var(--bg3);border:none;border-radius:10px;
  cursor:pointer;color:var(--txt2);display:flex;align-items:center;justify-content:center;transition:all .15s}
.mc:hover{background:var(--red);color:#fff}
.field{margin-bottom:14px}
.field label{display:block;font-size:.75rem;color:var(--txt2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.field input,.field select,.field textarea{
  width:100%;padding:11px 14px;background:var(--bg3);border:1px solid var(--border2);
  border-radius:11px;color:var(--txt);font-family:'Outfit',sans-serif;font-size:.9rem;outline:none;transition:border-color .2s
}
.field input:focus,.field select:focus{border-color:var(--acc)}
.field select option{background:var(--bg2)}
.mf{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;padding-top:16px;border-top:1px solid var(--border2)}
.btn-sec{padding:10px 20px;background:var(--bg3);border:1px solid var(--border2);border-radius:10px;
  color:var(--txt);cursor:pointer;font-family:'Outfit',sans-serif;font-size:.88rem;transition:all .15s}
.btn-sec:hover{border-color:var(--acc);color:var(--acc2)}
.btn-dng{padding:10px 20px;background:rgba(255,95,109,.1);border:1px solid rgba(255,95,109,.25);
  border-radius:10px;color:var(--red);cursor:pointer;font-family:'Outfit',sans-serif;font-size:.88rem;transition:all .15s}
.btn-dng:hover{background:rgba(255,95,109,.2)}
.btn-p{padding:10px 22px;background:linear-gradient(135deg,var(--acc),var(--acc3));border:none;
  border-radius:10px;color:#fff;cursor:pointer;font-family:'Outfit',sans-serif;font-size:.88rem;
  font-weight:600;transition:all .2s}
.btn-p:hover{box-shadow:0 4px 14px rgba(124,107,255,.4)}

/* MEMBER LIST */
.member-item{
  display:flex;align-items:center;gap:11px;padding:11px 13px;
  background:var(--bg3);border-radius:14px;margin-bottom:8px
}
.rbadge{font-size:.68rem;padding:2px 8px;border-radius:6px;font-weight:700}
.rbadge.owner{background:rgba(255,209,102,.15);color:var(--yellow);border:1px solid rgba(255,209,102,.25)}
.rbadge.admin{background:rgba(124,107,255,.15);color:var(--acc2);border:1px solid rgba(124,107,255,.25)}
.rbadge.banned{background:rgba(255,95,109,.15);color:var(--red);border:1px solid rgba(255,95,109,.25)}
.mb-acts{margin-left:auto;display:flex;gap:6px}
.mb-btn{padding:5px 11px;border-radius:8px;border:none;cursor:pointer;font-size:.75rem;font-family:'Outfit',sans-serif;font-weight:500;transition:all .15s}
.mb-btn.dng{background:rgba(255,95,109,.1);color:var(--red);border:1px solid rgba(255,95,109,.2)}
.mb-btn.prim{background:rgba(124,107,255,.1);color:var(--acc2);border:1px solid rgba(124,107,255,.2)}
.mb-btn:hover{filter:brightness(1.25)}

/* PROFILE EDIT */
.pav-wrap{position:relative;width:90px;height:90px;margin:0 auto 20px;cursor:pointer}
.pav-wrap .av{width:90px;height:90px;font-size:1.9rem}
.pav-edit{
  position:absolute;bottom:0;right:0;width:28px;height:28px;
  background:var(--acc);border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:12px;border:2px solid var(--bg1)
}

/* TOAST */
.toast{
  position:fixed;bottom:26px;right:24px;
  background:rgba(14,14,26,.95);backdrop-filter:blur(12px);
  border:1px solid var(--border);border-radius:14px;padding:12px 18px;
  font-size:.88rem;z-index:9999;animation:toastIn .25s ease;
  display:flex;align-items:center;gap:9px;box-shadow:0 8px 24px rgba(0,0,0,.4);
  max-width:300px
}
@keyframes toastIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.toast.s{border-color:rgba(6,214,160,.3);color:var(--green)}
.toast.e{border-color:rgba(255,95,109,.3);color:var(--red)}
.toast.i{border-color:rgba(124,107,255,.3);color:var(--acc2)}

/* LIGHTBOX */
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:850;display:none;
  align-items:center;justify-content:center;cursor:pointer}
#lightbox.show{display:flex}
#lightbox img{max-width:90vw;max-height:90vh;border-radius:14px}

/* USER SELECT */
.usr-sel{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:12px;cursor:pointer;transition:background .15s}
.usr-sel:hover{background:var(--bg3)}

/* BAN OPTIONS */
.ban-opts{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.bo{padding:7px 14px;border-radius:9px;background:var(--bg3);border:1px solid var(--border2);
  cursor:pointer;font-size:.82rem;transition:all .15s}
.bo.sel,.bo:hover{background:rgba(255,95,109,.12);border-color:rgba(255,95,109,.35);color:var(--red)}

/* SELECTED MEMBERS */
.sel-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;
  background:rgba(124,107,255,.12);border:1px solid rgba(124,107,255,.22);
  border-radius:20px;font-size:.8rem}
.chip-rm{background:none;border:none;color:var(--txt3);cursor:pointer;font-size:13px;padding:0}
.chip-rm:hover{color:var(--red)}

@media(max-width:700px){
  .sidebar{position:absolute;z-index:100;height:100%;transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
}
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, getDocs, collection, query, where, orderBy, onSnapshot, addDoc, updateDoc, serverTimestamp, arrayUnion, arrayRemove, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

const firebaseConfig = {
    apiKey: "AIzaSyB-yTlSlnozIhdpp-0vfAoZK92PHUMf_jU",
    authDomain: "ysend-e71e6.firebaseapp.com",
    projectId: "ysend-e71e6",
    storageBucket: "ysend-e71e6.firebasestorage.app",
    messagingSenderId: "78110029191",
    appId: "1:78110029191:web:6c4bdf3a40ee0664c6cf22"
};
const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);
const storage = getStorage(fbApp);

// ICE серверы для WebRTC
const ICE = {
    iceServers: [
        {urls:'stun:stun.l.google.com:19302'},
        {urls:'stun:stun1.l.google.com:19302'},
        {urls:'stun:stun.cloudflare.com:3478'},
        {urls:'turn:openrelay.metered.ca:80', username:'openrelayproject', credential:'openrelayproject'},
        {urls:'turn:openrelay.metered.ca:443', username:'openrelayproject', credential:'openrelayproject'},
        {urls:'turn:openrelay.metered.ca:443?transport=tcp', username:'openrelayproject', credential:'openrelayproject'}
    ]
};

// ============ ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ============
let me = null, meData = null;
let curChatId = null, curChatData = null;
let allChats = [], allUsers = [];
let unsubMsgs = null, unsubChats = null;

// WebRTC для групповых звонков (Mesh)
let localStream = null;
let peerConnections = new Map(); // key: userId, value: RTCPeerConnection
let callActive = false;
let callStartTime = 0;
let callTimerInterval = null;
let incomingCallDiv = null;
let unsubCallSignals = null;

// Другие переменные
let mediaRec = null, audioChunks = [], recInterval = null, recSecs = 0;
let pendingFile = null, pendingFType = null;
let selGroupMembers = [];
let ncTab = 'direct';
let banTgt = null, banDur = '1h';
let muted = false;

// Эмодзи
const EMOJIS = ['😀','😂','😍','🥰','😎','🤔','👍','❤️','🔥','💯','🎉','👋','😭','🤣','😊','🙈','👀','💬','✨','🚀'];

// ============ ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ============
window.showToast = (msg, t='i') => {
    const d = document.createElement('div');
    d.className=`toast ${t}`;
    const icons = {s:'✅',e:'❌',i:'ℹ️'};
    d.innerHTML=`<span>${icons[t]||'ℹ️'}</span> ${msg}`;
    document.body.appendChild(d);
    setTimeout(()=>d.remove(), 3200);
};
const ini = n => n ? n.charAt(0).toUpperCase() : '?';
const fmtTime = ts => {
    if(!ts) return '';
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    const now = new Date();
    if(d.toDateString()===now.toDateString()) return d.toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});
    return d.toLocaleDateString('ru',{day:'2-digit',month:'2-digit'});
};
const fmtDur = s => `${Math.floor(s/60)}:${(s%60).toString().padStart(2,'0')}`;
const esc = t => { if(!t) return ''; const d=document.createElement('div'); d.textContent=t; return d.innerHTML; };
const avatarBg = name => {
    const p=['linear-gradient(135deg,#7c6bff,#00d4b4)','linear-gradient(135deg,#ff6b9d,#c44dff)',
    'linear-gradient(135deg,#06d6a0,#1b9aaa)','linear-gradient(135deg,#ffd166,#ef476f)'];
    let h=0; for(const c of(name||'A')) h=(h*31+c.charCodeAt(0))%p.length;
    return p[Math.abs(h)%p.length];
};
const getOtherUser = chat => {
    const oid = chat?.members?.find(m => m !== me.uid);
    return allUsers.find(u => u.uid === oid);
};

// ============ АВТОРИЗАЦИЯ ============
window.setAuthTab = tab => {
    document.getElementById('loginForm').style.display = tab==='login'?'block':'none';
    document.getElementById('regForm').style.display = tab==='register'?'block':'none';
    document.querySelectorAll('.auth-tab').forEach((b,i)=>b.classList.toggle('active',(tab==='login'&&i===0)||(tab==='register'&&i===1)));
    document.getElementById('authErr').textContent='';
};
window.doLogin = async () => {
    const e=document.getElementById('loginEmail').value.trim(), p=document.getElementById('loginPass').value;
    if(!e||!p){document.getElementById('authErr').textContent='Заполните все поля';return;}
    try{ await signInWithEmailAndPassword(auth,e,p); }
    catch(err){ document.getElementById('authErr').textContent='Неверный email или пароль'; }
};
window.doRegister = async () => {
    const nick=document.getElementById('regNick').value.trim(),
          email=document.getElementById('regEmail').value.trim(),
          pass=document.getElementById('regPass').value;
    if(!nick||!email||!pass){document.getElementById('authErr').textContent='Заполните все поля';return;}
    if(pass.length<6){document.getElementById('authErr').textContent='Пароль мин. 6 символов';return;}
    try{
        const c = await createUserWithEmailAndPassword(auth,email,pass);
        await updateProfile(c.user,{displayName:nick});
        await setDoc(doc(db,'users',c.user.uid),{
            uid:c.user.uid,nickname:nick,email,avatar:null,
            role:'member',online:true,createdAt:serverTimestamp(),bannedUntil:null
        });
        showToast('Добро пожаловать в Ysend!','s');
    }catch(err){
        const msgs={'auth/email-already-in-use':'Email уже используется','auth/weak-password':'Слабый пароль','auth/invalid-email':'Неверный email'};
        document.getElementById('authErr').textContent=msgs[err.code]||err.message;
    }

function renderMsg(area, msg){
    const mine=msg.senderId===me.uid;
    const sender=allUsers.find(u=>u.uid===msg.senderId);
    const nm=sender?.nickname||msg.senderName||'?';
    if(msg.type==='system'){
        const d=document.createElement('div'); d.className='sys-msg'; d.textContent=msg.text;
        area.appendChild(d); return;
    }
    const row=document.createElement('div'); row.className=`msg-row${mine?' mine':''}`;
    let avH=sender?.avatar?`<img src="${sender.avatar}">`:(ini(nm));
    let content='';
    if(msg.type==='image') content=`<img class="msg-img" src="${esc(msg.url)}" onclick="document.getElementById('lbImg').src='${msg.url}';document.getElementById('lightbox').classList.add('show')">`;
    else if(msg.type==='video') content=`<video class="msg-video" controls src="${esc(msg.url)}"></video>`;
    else if(msg.type==='voice'){
        const bars=Array.from({length:20},()=>`<div class="vb" style="height:${4+Math.random()*20}px"></div>`).join('');
        content=`<div class="voice-msg" onclick="playVoice('${msg.url}',this)">
            <div class="vp-btn"><i class="fas fa-play" style="font-size:11px"></i></div>
            <div class="vw">${bars}</div><div class="v-dur">${msg.duration||'0:00'}</div>
        </div>`;
    } else {
        content=`<div class="bubble">${curChatData?.type==='group'&&!mine?`<div class="sender-nm">${esc(nm)}</div>`:''}<span>${esc(msg.text)}</span></div>`;
    }
    if(msg.type==='image'||msg.type==='video'||msg.type==='voice'){
        content=`<div class="bubble" style="padding:6px;background:${mine?'linear-gradient(135deg,var(--acc),var(--acc3))':'var(--bg3)'}">${content}</div>`;
    }
    row.innerHTML=`${!mine?`<div class="av" style="width:30px;height:30px;font-size:.78rem;background:${avatarBg(nm)}">${avH}</div>`:''}<div class="msg-bub">${content}<div class="msg-ts">${fmtTime(msg.createdAt)}</div></div>${mine?`<div class="av" style="width:30px;height:30px;font-size:.78rem;background:${avatarBg(nm)}">${avH}</div>`:''}`;
    area.appendChild(row);
}
window.playVoice = (url, el) => {
    const a=new Audio(url); a.play();
    const btn=el.querySelector('.vp-btn'); btn.innerHTML='<i class="fas fa-pause" style="font-size:11px"></i>';
    const bars=el.querySelectorAll('.vb');
    const iv=setInterval(()=>{ if(a.paused||a.ended){clearInterval(iv);btn.innerHTML='<i class="fas fa-play" style="font-size:11px"></i>';bars.forEach(b=>b.style.height='12px');return;} bars.forEach(b=>b.style.height=(4+Math.random()*20)+'px'); },100);
    a.onended=()=>{clearInterval(iv);btn.innerHTML='<i class="fas fa-play" style="font-size:11px"></i>';bars.forEach(b=>b.style.height='12px');};
};

window.toggleVoice = async () => {
    if(!curChatId){showToast('Выберите чат','e');return;}
    if(mediaRec&&mediaRec.state==='recording'){mediaRec.stop();return;}
    try{
        const stream=await navigator.mediaDevices.getUserMedia({audio:true});
        mediaRec=new MediaRecorder(stream); audioChunks=[]; recSecs=0;
        mediaRec.ondataavailable=e=>audioChunks.push(e.data);
        mediaRec.onstop=async()=>{
            clearInterval(recInterval);
            document.getElementById('recBar').classList.remove('show');
            document.getElementById('voiceBtn').classList.remove('rec-active');
            stream.getTracks().forEach(t=>t.stop());
            const blob=new Blob(audioChunks,{type:'audio/webm'});
            if(blob.size<500){showToast('Сообщение слишком короткое','e');return;}
            showToast('Отправка голосового...','i');
            try{
                const r=ref(storage,`voice/${curChatId}/${Date.now()}.webm`);
                await uploadBytes(r,blob); const url=await getDownloadURL(r);
                await addDoc(collection(db,'chats',curChatId,'messages'),{senderId:me.uid,senderName:meData.nickname,type:'voice',url,duration:fmtDur(recSecs),text:'',createdAt:serverTimestamp()});
                await updateMeta('🎤 Голосовое');
                showToast('Отправлено!','s');
            }catch(e){showToast('Ошибка: '+e.message,'e');}
        };
        mediaRec.start();
        document.getElementById('voiceBtn').classList.add('rec-active');
        document.getElementById('recBar').classList.add('show');
        recInterval=setInterval(()=>{ recSecs++; document.getElementById('recTime').textContent=fmtDur(recSecs); },1000);
    }catch(e){showToast('Нет доступа к микрофону','e');}
};
window.cancelRec = () => {
    if(mediaRec){mediaRec.onstop=()=>{};mediaRec.stop();}
    clearInterval(recInterval);
    document.getElementById('recBar').classList.remove('show');
    document.getElementById('voiceBtn').classList.remove('rec-active');
};

        const isOwnerM=curChatData.createdBy===m.uid;
        const isAdminM=(curChatData.admins||[]).includes(m.uid);
        const isSelf=m.uid===me.uid;
        const banned=m.bannedUntil && new Date(m.bannedUntil) > new Date();
        const av=m.avatar?`<img src="${m.avatar}">`:(ini(m.nickname));
        return `<div class="member-item">
            <div class="av" style="width:40px;height:40px;font-size:.9rem;background:${avatarBg(m.nickname)}">${av}</div>
            <div style="flex:1;min-width:0">
                <div style="font-weight:600;font-size:.9rem">${esc(m.nickname)}${isSelf?' (Вы)':''}</div>
                ${banned?'<div style="font-size:.72rem;color:var(--red)">Заблокирован</div>':''}
            </div>
            ${isOwnerM?'<span class="rbadge owner">Создатель</span>':isAdminM?'<span class="rbadge admin">Админ</span>':''}
            ${banned?'<span class="rbadge banned">БАН</span>':''}
            ${!isSelf&&isAdmin?`<div class="mb-acts">
                ${!isOwnerM&&!banned?`<button class="mb-btn dng" onclick="openBanModal('${m.uid}','${m.nickname}')">Бан</button>`:''}
                ${banned?`<button class="mb-btn prim" onclick="doUnban('${m.uid}')">Разбан</button>`:''}
                ${isOwner&&!isOwnerM?(!isAdminM?`<button class="mb-btn prim" onclick="setAdmin('${m.uid}',true)">+Админ</button>`:`<button class="mb-btn dng" onclick="setAdmin('${m.uid}',false)">−Админ</button>`):''}
            </div>`:''}
        </div>`;
    }).join('');
};
window.setAdmin = async (uid,make) => {
    if(meData.role!=='owner'){showToast('Только владелец может управлять администраторами','e');return;}
    await updateDoc(doc(db,'chats',curChatId),make?{admins:arrayUnion(uid)}:{admins:arrayRemove(uid)});
    const u=allUsers.find(u=>u.uid===uid);
    await addDoc(collection(db,'chats',curChatId,'messages'),{type:'system',text:`⚡ ${u?.nickname||uid} ${make?'назначен':'снят с поста'} администратором`,senderId:me.uid,createdAt:serverTimestamp()});
    showToast(make?'Администратор назначен':'Права отозваны','s');
    curChatData=allChats.find(c=>c.id===curChatId)||curChatData;
    openChatInfo();
};
window.openBanModal = (uid,nick) => {
    banTgt=uid; banDur='1h';
    document.getElementById('banInfo').textContent=`Пользователь: ${nick}`;
    document.getElementById('banReason').value='';
    document.querySelectorAll('.bo').forEach((el,i)=>el.classList.toggle('sel',i===0));
    closeModal('chatInfoModal');
    document.getElementById('banModal').classList.add('active');
};
window.selBan = (el,dur) => { banDur=dur; document.querySelectorAll('.bo').forEach(b=>b.classList.remove('sel')); el.classList.add('sel'); };
window.execBan = async () => {
    if(!banTgt) return;
    const reason=document.getElementById('banReason').value.trim()||'Нарушение правил';
    const now=Date.now();
    const map={'1h':3600000,'24h':86400000,'7d':604800000,'30d':2592000000};
    const banUntil=banDur==='forever'?new Date('2099-12-31'):new Date(now+(map[banDur]||3600000));
    await updateDoc(doc(db,'users',banTgt),{bannedUntil:banUntil,bannedReason:reason});
    const nick=allUsers.find(u=>u.uid===banTgt)?.nickname||banTgt;
    const durs={'1h':'на 1 час','24h':'на 24 часа','7d':'на 7 дней','30d':'на 30 дней','forever':'навсегда'};
    if(curChatId) await addDoc(collection(db,'chats',curChatId,'messages'),{type:'system',text:`🔨 ${nick} заблокирован ${durs[banDur]}: ${reason}`,senderId:me.uid,createdAt:serverTimestamp()});
    closeModal('banModal'); showToast(`${nick} заблокирован`,'s'); banTgt=null;
};
window.doUnban = async uid => {
    await updateDoc(doc(db,'users',uid),{bannedUntil:null,bannedReason:null});
    const nick=allUsers.find(u=>u.uid===uid)?.nickname||uid;
    if(curChatId) await addDoc(collection(db,'chats',curChatId,'messages'),{type:'system',text:`🔓 Блокировка ${nick} снята`,senderId:me.uid,createdAt:serverTimestamp()});
    showToast(`${nick} разблокирован`,'s');
    openChatInfo();
};

// ============ ГРУППОВЫЕ ЗВОНКИ (WEBRTC MESH) ============
async function sendSignal(chatId, targetUid, type, data){
    const key = `${chatId}_${me.uid}_${type}_${Date.now()}`;
    await setDoc(doc(db,'callSignals',targetUid,'incoming',key),{
        type, data: JSON.stringify(data), fromUid: me.uid, chatId, ts: serverTimestamp()
    });
}

function startIncomingCallListener(){
    if(unsubCallSignals) unsubCallSignals();
    const q=collection(db,'callSignals',me.uid,'incoming');
    unsubCallSignals=onSnapshot(q, async snap=>{
        for(const change of snap.docChanges()){
            if(change.type!=='added') continue;
            const sig=change.doc.data();
            let data={};
            try{data=JSON.parse(sig.data||'{}');}catch(e){}
            await deleteDoc(change.doc.ref).catch(()=>{});
            
            if(sig.type==='offer'){
                if(callActive){
                    await sendSignal(sig.chatId,sig.fromUid,'busy',{});
                    continue;
                }
                const caller=allUsers.find(u=>u.uid===sig.fromUid);
                showIncomingGroupCall(sig.chatId, sig.fromUid, caller?.nickname||'Пользователь', data);
            } 
            else if(sig.type==='answer' && peerConnections.has(sig.fromUid)){
                try{ 
                    await peerConnections.get(sig.fromUid).setRemoteDescription(new RTCSessionDescription(data)); 
                }catch(e){}
            } 
            else if(sig.type==='ice' && peerConnections.has(sig.fromUid)){
                try{ 
                    if(data && data.candidate) await peerConnections.get(sig.fromUid).addIceCandidate(new RTCIceCandidate(data)); 
                }catch(e){}
            } 
            else if(sig.type==='hangup'){
                if(peerConnections.has(sig.fromUid)){
                    const pc = peerConnections.get(sig.fromUid);
                    pc.close();
                    peerConnections.delete(sig.fromUid);
                }
                if(peerConnections.size === 0 && callActive){
                    hangUp();
                    showToast('Все участники покинули звонок','i');
                }
                updateParticipantsUI();
            }
            else if(sig.type==='busy'){
                showToast('Пользователь занят','i');
            }
        }
    });
}

function updateParticipantsUI(){
    const container = document.getElementById('callParticipants');
    if(!container) return;
    const participants = Array.from(peerConnections.keys());
    const allParticipants = [...participants];
    if(curChatData?.type === 'group'){
        const others = curChatData.members?.filter(m => m !== me.uid) || [];
        others.forEach(uid => {
            if(!allParticipants.includes(uid) && !peerConnections.has(uid)){
                allParticipants.push(uid);
            }
        });
    }
    if(allParticipants.length === 0){
        container.innerHTML = '<div style="color:var(--txt3);font-size:.8rem">Ожидание участников...</div>';
        return;
    }
    container.innerHTML = allParticipants.map(uid => {
        const user = allUsers.find(u => u.uid === uid);
        const isConnected = peerConnections.has(uid);
        return `<div class="participant">
            <div class="participant-av" style="background:${avatarBg(user?.nickname||'?')}">${user?.avatar?`<img src="${user.avatar}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`:(ini(user?.nickname||'?'))}</div>
            <div class="participant-name">${esc(user?.nickname||'Пользователь')}${isConnected?' 🟢':''}</div>
        </div>`;
    }).join('');
}

window.startCall = async () => {
    if(!curChatId||!curChatData){showToast('Выберите чат','e');return;}
    if(callActive){showToast('Уже идёт звонок','e');return;}
    
    try{ 
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true }); 
    } catch(e){ 
        showToast('Нет доступа к микрофону','e'); 
        return; 
    }
    
    callActive = true;
    callStartTime = 0;
    
    document.getElementById('callAv').innerHTML = curChatData.type==='group' ? '<i class="fas fa-users" style="font-size:2rem"></i>' : (ini(curChatData.name||'Группа'));
    document.getElementById('callNm').textContent = curChatData.type==='group' ? (curChatData.name||'Групповой звонок') : 'Групповой звонок';
    document.getElementById('callSt').textContent = 'Ожидание участников...';
    document.getElementById('callTm').style.display = 'none';
    document.getElementById('callWaves').classList.remove('show');
    document.getElementById('callOverlay').classList.add('active');
    
    // Отправляем приглашения всем участникам группы
    const members = curChatData.members || [];
    for(const uid of members){
        if(uid === me.uid) continue;
        await sendSignal(curChatId, uid, 'offer', {});
        // Создаём PeerConnection для каждого участника
        const pc = new RTCPeerConnection(ICE);
        localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
        
        pc.ontrack = (ev) => {
            console.log('Получен аудио поток от', uid);
        };
        
        pc.onicecandidate = async (ev) => {
            if(ev.candidate) await sendSignal(curChatId, uid, 'ice', ev.candidate.toJSON());
        };
        
        pc.oniceconnectionstatechange = () => {
            console.log(`ICE состояние с ${uid}:`, pc.iceConnectionState);
            if(pc.iceConnectionState === 'connected' || pc.iceConnectionState === 'completed'){
                if(peerConnections.size > 0 && !callStartTime){
                    callStartTime = Date.now();
                    document.getElementById('callSt').textContent = 'В разговоре';
                    document.getElementById('callTm').style.display = 'block';
                    document.getElementById('callWaves').classList.add('show');
                    document.getElementById('callAv').classList.add('connected');
                    callTimerInterval = setInterval(() => {
                        if(callStartTime) document.getElementById('callTm').textContent = fmtDur(Math.floor((Date.now() - callStartTime) / 1000));
                    }, 1000);
                }
                updateParticipantsUI();
            } else if(pc.iceConnectionState === 'failed'){
                showToast(`Не удалось соединиться с участником`,'e');
            }
        };
        
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        await sendSignal(curChatId, uid, 'offer', offer);
        peerConnections.set(uid, pc);
    }
    updateParticipantsUI();
    
    await addDoc(collection(db,'chats',curChatId,'messages'),{
        type:'system', text:`📞 ${meData.nickname} начал групповой звонок`,
        senderId:me.uid, createdAt:serverTimestamp()
    });
    
    // Таймаут 30 секунд
    setTimeout(() => {
        if(callActive && peerConnections.size === 0){
            hangUp();
            showToast('Никто не ответил','i');
        }
    }, 30000);
};

function showIncomingGroupCall(chatId, fromUid, callerName, offer){
    if(incomingCallDiv) incomingCallDiv.remove();
    if(callActive){
        sendSignal(chatId, fromUid, 'busy', {});
        return;
    }
    
    incomingCallDiv=document.createElement('div');
    incomingCallDiv.className='incoming-call';
    const chat = allChats.find(c => c.id === chatId);
    const groupName = chat?.name || 'Групповой звонок';
    incomingCallDiv.innerHTML=`<div class="ic-info">
        <div class="av" style="width:46px;height:46px;font-size:1.1rem;background:${avatarBg(callerName)}">${ini(callerName)}</div>
        <div><div style="font-weight:700">${esc(callerName)}</div><div style="font-size:.75rem;color:var(--txt2);margin-top:2px">📞 Групповой звонок в "${esc(groupName)}"</div></div>
    </div>
    <div class="ic-btns">
        <button class="ic-btn ans" id="ansGroupBtn"><i class="fas fa-phone"></i></button>
        <button class="ic-btn dec" id="decGroupBtn"><i class="fas fa-phone-slash"></i></button>
    </div>`;
    document.body.appendChild(incomingCallDiv);
    
    document.getElementById('ansGroupBtn').onclick = () => answerGroupCall(chatId, fromUid, offer);
    document.getElementById('decGroupBtn').onclick = () => declineCall(chatId, fromUid);
    
    setTimeout(()=>{ if(incomingCallDiv&&incomingCallDiv.parentNode){incomingCallDiv.remove();incomingCallDiv=null;} },30000);
}

async function answerGroupCall(chatId, fromUid, offer){
    if(incomingCallDiv){incomingCallDiv.remove();incomingCallDiv=null;}
    if(callActive){ showToast('Уже в звонке','e'); return; }
    
    const chat = allChats.find(c => c.id === chatId);
    if(chat){ curChatData=chat; await selectChat(chatId); }
    
    try{ 
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true }); 
    } catch(e){ 
        showToast('Нет доступа к микрофону','e'); 
        return; 
    }
    
    callActive = true;
    callStartTime = 0;
    
    document.getElementById('callAv').innerHTML = '<i class="fas fa-users" style="font-size:2rem"></i>';
    document.getElementById('callNm').textContent = chat?.name || 'Групповой звонок';
    document.getElementById('callSt').textContent = 'Подключение...';
    document.getElementById('callTm').style.display = 'none';
    document.getElementById('callWaves').classList.remove('show');
    document.getElementById('callOverlay').classList.add('active');
    
    // Отвечаем инициатору
    const pc = new RTCPeerConnection(ICE);
    localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
    
    pc.ontrack = (ev) => { console.log('Аудио поток получен'); };
    pc.onicecandidate = async (ev) => {
        if(ev.candidate) await sendSignal(chatId, fromUid, 'ice', ev.candidate.toJSON());
    };
    pc.oniceconnectionstatechange = () => {
        if(pc.iceConnectionState === 'connected' || pc.iceConnectionState === 'completed'){
            if(!callStartTime){
                callStartTime = Date.now();
                document.getElementById('callSt').textContent = 'В разговоре';
                document.getElementById('callTm').style.display = 'block';
                document.getElementById('callWaves').classList.add('show');
                document.getElementById('callAv').classList.add('connected');
                callTimerInterval = setInterval(() => {
                    if(callStartTime) document.getElementById('callTm').textContent = fmtDur(Math.floor((Date.now() - callStartTime) / 1000));
                }, 1000);
            }
        }
    };
    
    await pc.setRemoteDescription(new RTCSessionDescription(offer));
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    await sendSignal(chatId, fromUid, 'answer', answer);
    peerConnections.set(fromUid, pc);
    
    updateParticipantsUI();
    
    // Присоединяемся к остальным участникам (через инициатора)
    const members = chat?.members || [];
    for(const uid of members){
        if(uid !== me.uid && uid !== fromUid){
            const newPc = new RTCPeerConnection(ICE);
            localStream.getTracks().forEach(t => newPc.addTrack(t, localStream));
            newPc.ontrack = () => {};
            newPc.onicecandidate = async (ev) => {
                if(ev.candidate) await sendSignal(chatId, uid, 'ice', ev.candidate.toJSON());
            };
            const offerTo = await newPc.createOffer();
            await newPc.setLocalDescription(offerTo);
            await sendSignal(chatId, uid, 'offer', offerTo);
            peerConnections.set(uid, newPc);
        }
    }
}

async function declineCall(chatId, fromUid){
    if(incomingCallDiv){incomingCallDiv.remove();incomingCallDiv=null;}
    await sendSignal(chatId, fromUid, 'hangup', {});
    showToast('Звонок отклонён','i');
}

window.hangUp = async () => {
    clearInterval(callTimerInterval);
    callTimerInterval = null;
    
    if(curChatId){
        for(const [uid, pc] of peerConnections){
            try{
                await sendSignal(curChatId, uid, 'hangup', {});
                pc.close();
            }catch(e){}
        }
    }
    peerConnections.clear();
    
    if(localStream){
        localStream.getTracks().forEach(t => t.stop());
        localStream = null;
    }
    
    document.getElementById('callOverlay').classList.remove('active');
    document.getElementById('callAv').classList.remove('connected');
    document.getElementById('callWaves').classList.remove('show');
    
    if(callActive && curChatId){
        const elapsed = callStartTime ? Math.floor((Date.now() - callStartTime) / 1000) : 0;
        if(elapsed > 3){
            await addDoc(collection(db,'chats',curChatId,'messages'),{
                type:'system', text:`📵 Групповой звонок завершён (${fmtDur(elapsed)})`,
                senderId:me.uid, createdAt:serverTimestamp()
            });
        }
    }
    
    callActive = false;
    callStartTime = 0;
    muted = false;
    const muteBtn = document.getElementById('muteBtn');
    if(muteBtn){
        muteBtn.innerHTML = '<i class="fas fa-microphone"></i>';
        muteBtn.classList.remove('muted');
    }
};

window.toggleMute = () => {
    muted = !muted;
    if(localStream) localStream.getAudioTracks().forEach(t => t.enabled = !muted);
    const btn = document.getElementById('muteBtn');
    btn.innerHTML = muted ? '<i class="fas fa-microphone-slash"></i>' : '<i class="fas fa-microphone"></i>';
    btn.classList.toggle('muted', muted);
    showToast(muted ? 'Микрофон выключен' : 'Микрофон включён','i');
};

window.closeModal = id => document.getElementById(id).classList.remove('active');
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m) m.classList.remove('active');}));

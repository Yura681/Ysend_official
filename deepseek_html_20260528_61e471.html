<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ysend - Мессенджер</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg: #0a0a0f;
    --bg2: #111118;
    --bg3: #1a1a23;
    --bg4: #222230;
    --accent: #6c63ff;
    --accent2: #a78bfa;
    --accent3: #38bdf8;
    --green: #22d3a5;
    --red: #f87171;
    --yellow: #fbbf24;
    --text: #f0f0ff;
    --text2: #9898b8;
    --text3: #5a5a7a;
    --border: #2a2a3a;
}

body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    height: 100vh;
    overflow: hidden;
}

/* Анимации */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
}

/* Скроллбар */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* Экран авторизации */
#authScreen {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, #0a0a0f 0%, #111118 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
}

.auth-card {
    background: rgba(17, 17, 24, 0.95);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 28px;
    padding: 48px 40px;
    width: 440px;
    max-width: 90vw;
    animation: fadeIn 0.5s ease;
}

.auth-logo {
    font-size: 2.8rem;
    font-weight: 800;
    background: linear-gradient(135deg, var(--accent), var(--accent3));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-align: center;
    margin-bottom: 8px;
}

.auth-sub {
    color: var(--text2);
    text-align: center;
    margin-bottom: 32px;
    font-size: 0.9rem;
}

.auth-tabs {
    display: flex;
    gap: 8px;
    background: var(--bg3);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 24px;
}

.auth-tab {
    flex: 1;
    padding: 10px;
    background: transparent;
    border: none;
    color: var(--text2);
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.9rem;
    transition: all 0.2s;
}

.auth-tab.active {
    background: var(--accent);
    color: white;
}

.auth-field {
    margin-bottom: 16px;
}

.auth-field label {
    display: block;
    font-size: 0.75rem;
    color: var(--text2);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.auth-field input {
    width: 100%;
    padding: 12px 16px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-family: inherit;
    font-size: 0.9rem;
    outline: none;
    transition: all 0.2s;
}

.auth-field input:focus {
    border-color: var(--accent);
}

.btn-primary {
    width: 100%;
    padding: 12px;
    background: linear-gradient(135deg, var(--accent), #5b52e0);
    border: none;
    border-radius: 12px;
    color: white;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
    transition: all 0.2s;
}

.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(108, 99, 255, 0.3);
}

.auth-err {
    color: var(--red);
    font-size: 0.8rem;
    text-align: center;
    margin-top: 12px;
    min-height: 20px;
}

/* Основное приложение */
#app {
    display: none;
    height: 100vh;
}

#app.show {
    display: flex;
}

/* Боковая панель */
.sidebar {
    width: 320px;
    background: var(--bg2);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.sidebar-header {
    padding: 20px;
    border-bottom: 1px solid var(--border);
}

.logo {
    font-size: 1.5rem;
    font-weight: 800;
    background: linear-gradient(135deg, var(--accent), var(--accent3));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 16px;
}

.search-box {
    position: relative;
    margin-bottom: 12px;
}

.search-box input {
    width: 100%;
    padding: 10px 16px 10px 38px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-family: inherit;
    font-size: 0.85rem;
    outline: none;
}

.search-box .search-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text3);
}

.sidebar-tabs {
    display: flex;
    gap: 4px;
    padding: 12px 20px;
}

.sidebar-tab {
    flex: 1;
    padding: 8px;
    background: transparent;
    border: none;
    color: var(--text2);
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.85rem;
    transition: all 0.2s;
}

.sidebar-tab.active {
    background: rgba(108, 99, 255, 0.15);
    color: var(--accent2);
}

.chat-list {
    flex: 1;
    overflow-y: auto;
    padding: 0 12px 12px;
}

.chat-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    border-radius: 14px;
    cursor: pointer;
    transition: background 0.2s;
    margin-bottom: 4px;
}

.chat-item:hover {
    background: var(--bg3);
}

.chat-item.active {
    background: rgba(108, 99, 255, 0.12);
}

.avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent3));
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 1.1rem;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
}

.avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.online-dot {
    position: absolute;
    bottom: 2px;
    right: 2px;
    width: 12px;
    height: 12px;
    background: var(--green);
    border-radius: 50%;
    border: 2px solid var(--bg2);
}

.chat-info {
    flex: 1;
    min-width: 0;
}

.chat-name {
    font-weight: 600;
    font-size: 0.9rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.chat-last {
    font-size: 0.75rem;
    color: var(--text2);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2px;
}

.chat-meta {
    text-align: right;
    flex-shrink: 0;
}

.chat-time {
    font-size: 0.7rem;
    color: var(--text3);
}

.unread-badge {
    background: var(--accent);
    color: white;
    font-size: 0.7rem;
    font-weight: 700;
    border-radius: 50%;
    min-width: 20px;
    height: 20px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0 5px;
    margin-top: 4px;
}

.sidebar-footer {
    padding: 16px 20px;
    border-top: 1px solid var(--border);
}

.profile-card {
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    padding: 8px;
    border-radius: 12px;
    transition: background 0.2s;
}

.profile-card:hover {
    background: var(--bg3);
}

.profile-info {
    flex: 1;
}

.profile-name {
    font-weight: 600;
    font-size: 0.9rem;
}

.profile-role {
    font-size: 0.7rem;
    color: var(--accent2);
}

.icon-btn {
    width: 32px;
    height: 32px;
    background: var(--bg3);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    color: var(--text2);
}

.icon-btn:hover {
    background: var(--bg4);
    color: var(--text);
}

/* Область чата */
.chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    overflow: hidden;
}

.chat-header {
    padding: 16px 24px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
}

.chat-title {
    font-weight: 700;
    font-size: 1.1rem;
}

.chat-status {
    font-size: 0.75rem;
    color: var(--text2);
}

.header-actions {
    margin-left: auto;
    display: flex;
    gap: 8px;
}

.call-btn {
    padding: 8px 16px;
    background: rgba(108, 99, 255, 0.15);
    border: 1px solid rgba(108, 99, 255, 0.3);
    border-radius: 10px;
    color: var(--accent2);
    cursor: pointer;
    font-family: inherit;
    font-size: 0.85rem;
    transition: all 0.2s;
}

.call-btn:hover {
    background: rgba(108, 99, 255, 0.25);
}

/* Сообщения */
.messages-area {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.message-row {
    display: flex;
    gap: 10px;
    animation: fadeIn 0.2s ease;
}

.message-row.mine {
    flex-direction: row-reverse;
}

.message-avatar {
    width: 36px;
    height: 36px;
    font-size: 0.9rem;
    flex-shrink: 0;
}

.message-bubble {
    max-width: 65%;
}

.message-bubble.mine {
    align-items: flex-end;
    display: flex;
    flex-direction: column;
}

.bubble {
    padding: 10px 14px;
    border-radius: 18px;
    background: var(--bg3);
    font-size: 0.9rem;
    line-height: 1.4;
    word-break: break-word;
}

.message-row.mine .bubble {
    background: linear-gradient(135deg, var(--accent), #5b52e0);
    border-bottom-right-radius: 4px;
}

.message-row:not(.mine) .bubble {
    border-bottom-left-radius: 4px;
}

.sender-name {
    font-size: 0.7rem;
    color: var(--accent2);
    font-weight: 600;
    margin-bottom: 4px;
}

.message-time {
    font-size: 0.65rem;
    color: var(--text3);
    margin-top: 4px;
    padding: 0 4px;
}

.message-row.mine .message-time {
    text-align: right;
}

.message-image {
    max-width: 250px;
    max-height: 200px;
    border-radius: 12px;
    cursor: pointer;
}

.message-video {
    max-width: 250px;
    border-radius: 12px;
}

.message-voice {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 14px;
    background: var(--bg3);
    border-radius: 18px;
    cursor: pointer;
    min-width: 180px;
}

.message-row.mine .message-voice {
    background: linear-gradient(135deg, var(--accent), #5b52e0);
}

.voice-play {
    width: 32px;
    height: 32px;
    background: rgba(255,255,255,0.15);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
}

.voice-wave {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 2px;
    height: 30px;
}

.wave-bar {
    width: 3px;
    background: rgba(255,255,255,0.5);
    border-radius: 2px;
    transition: height 0.1s;
}

.voice-duration {
    font-size: 0.7rem;
    color: var(--text2);
}

.system-message {
    text-align: center;
    font-size: 0.7rem;
    color: var(--text3);
    padding: 4px 12px;
    background: rgba(255,255,255,0.03);
    border-radius: 20px;
    width: fit-content;
    margin: 8px auto;
}

/* Область ввода */
.input-area {
    padding: 16px 24px;
    background: var(--bg2);
    border-top: 1px solid var(--border);
}

.input-container {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 8px 12px;
}

#messageInput {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: inherit;
    font-size: 0.9rem;
    resize: none;
    max-height: 100px;
    padding: 6px 0;
}

#messageInput::placeholder {
    color: var(--text3);
}

.input-btn {
    width: 36px;
    height: 36px;
    background: transparent;
    border: none;
    cursor: pointer;
    border-radius: 8px;
    color: var(--text2);
    font-size: 1.2rem;
    transition: all 0.2s;
}

.input-btn:hover {
    background: var(--bg4);
    color: var(--text);
}

.send-btn {
    width: 36px;
    height: 36px;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    color: white;
    transition: all 0.2s;
}

.send-btn:hover {
    background: #5b52e0;
    transform: scale(1.05);
}

/* Модальные окна */
.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
}

.modal-overlay.show {
    display: flex;
}

.modal {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 32px;
    width: 480px;
    max-width: 90vw;
    max-height: 85vh;
    overflow-y: auto;
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
}

.modal-header h2 {
    font-size: 1.3rem;
}

.modal-close {
    width: 32px;
    height: 32px;
    background: var(--bg3);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    color: var(--text2);
}

.field {
    margin-bottom: 16px;
}

.field label {
    display: block;
    font-size: 0.75rem;
    color: var(--text2);
    margin-bottom: 6px;
    text-transform: uppercase;
}

.field input, .field select, .field textarea {
    width: 100%;
    padding: 10px 14px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: inherit;
    font-size: 0.9rem;
    outline: none;
}

.modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
}

/* Звонки */
#callOverlay {
    position: fixed;
    inset: 0;
    background: rgba(10,10,15,0.98);
    z-index: 1100;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
}

#callOverlay.show {
    display: flex;
}

.call-avatar {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent3));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3rem;
    font-weight: 700;
    border: 3px solid var(--accent);
    animation: pulse 2s infinite;
}

.call-controls {
    display: flex;
    gap: 20px;
    margin-top: 20px;
}

.call-btn-ctrl {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    font-size: 1.5rem;
    transition: all 0.2s;
}

.call-btn-ctrl.end {
    background: var(--red);
    color: white;
}

.call-btn-ctrl:active {
    transform: scale(0.95);
}

/* Участники */
.member-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px;
    background: var(--bg3);
    border-radius: 12px;
    margin-bottom: 8px;
}

.role-badge {
    font-size: 0.7rem;
    padding: 2px 8px;
    border-radius: 6px;
    font-weight: 600;
}

.role-badge.owner {
    background: rgba(251,191,36,0.2);
    color: var(--yellow);
}

.role-badge.admin {
    background: rgba(108,99,255,0.2);
    color: var(--accent2);
}

/* Уведомления */
.toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 24px;
    z-index: 2000;
    animation: fadeIn 0.3s ease;
}
</style>
</head>
<body>

<!-- Экран авторизации -->
<div id="authScreen">
    <div class="auth-card">
        <div class="auth-logo">Ysend</div>
        <div class="auth-sub">Современный мессенджер для свободного общения</div>
        <div class="auth-tabs">
            <button class="auth-tab active" onclick="switchAuthTab('login')">Вход</button>
            <button class="auth-tab" onclick="switchAuthTab('register')">Регистрация</button>
        </div>
        <div id="loginForm">
            <div class="auth-field">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="example@email.com">
            </div>
            <div class="auth-field">
                <label>Пароль</label>
                <input type="password" id="loginPassword" placeholder="••••••••">
            </div>
            <button class="btn-primary" onclick="login()">Войти →</button>
        </div>
        <div id="registerForm" style="display: none;">
            <div class="auth-field">
                <label>Никнейм</label>
                <input type="text" id="regNickname" placeholder="Как вас называть?">
            </div>
            <div class="auth-field">
                <label>Email</label>
                <input type="email" id="regEmail" placeholder="example@email.com">
            </div>
            <div class="auth-field">
                <label>Пароль</label>
                <input type="password" id="regPassword" placeholder="Минимум 6 символов">
            </div>
            <button class="btn-primary" onclick="register()">Создать аккаунт →</button>
        </div>
        <div class="auth-err" id="authError"></div>
    </div>
</div>

<!-- Основное приложение -->
<div id="app">
    <!-- Боковая панель -->
    <div class="sidebar">
        <div class="sidebar-header">
            <div class="logo">Ysend</div>
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Поиск чатов..." oninput="filterChats()">
            </div>
            <div class="sidebar-tabs">
                <button class="sidebar-tab active" onclick="switchSidebarTab('chats', this)">💬 Чаты</button>
                <button class="sidebar-tab" onclick="switchSidebarTab('users', this)">👥 Пользователи</button>
            </div>
        </div>
        <div class="chat-list" id="chatList"></div>
        <div class="sidebar-footer">
            <div class="profile-card" onclick="openProfileModal()">
                <div class="avatar" id="myAvatar">?</div>
                <div class="profile-info">
                    <div class="profile-name" id="myName">Загрузка...</div>
                    <div class="profile-role" id="myRole">Участник</div>
                </div>
                <button class="icon-btn" onclick="event.stopPropagation(); openNewChatModal()" title="Новый чат">➕</button>
                <button class="icon-btn" onclick="event.stopPropagation(); logout()" title="Выйти">🚪</button>
            </div>
        </div>
    </div>

    <!-- Область чата -->
    <div class="chat-area">
        <div id="noChatSelected" style="flex:1; display: flex; align-items: center; justify-content: center; color: var(--text3);">
            <div style="text-align: center;">
                <div style="font-size: 3rem; margin-bottom: 16px;">💬</div>
                <div>Выберите чат или создайте новый</div>
            </div>
        </div>
        <div id="chatScreen" style="display: none; flex: 1; flex-direction: column; overflow: hidden;">
            <div class="chat-header">
                <div class="avatar" id="chatAvatar">?</div>
                <div>
                    <div class="chat-title" id="chatTitle">...</div>
                    <div class="chat-status" id="chatStatus">...</div>
                </div>
                <div class="header-actions">
                    <button class="call-btn" onclick="startCall('audio')">📞 Звонок</button>
                    <button class="call-btn" onclick="startCall('video')">📹 Видео</button>
                    <button class="icon-btn" onclick="openChatInfo()">ℹ️</button>
                </div>
            </div>
            <div class="messages-area" id="messagesArea"></div>
            <div class="input-area">
                <div class="input-container">
                    <textarea id="messageInput" rows="1" placeholder="Напишите сообщение..." onkeydown="handleKeyPress(event)" oninput="autoResize(this)"></textarea>
                    <label class="input-btn" style="cursor: pointer;">📎
                        <input type="file" id="fileInput" accept="image/*,video/*" style="display: none;" onchange="handleFileSelect(event)">
                    </label>
                    <button class="input-btn" id="voiceBtn" onclick="toggleVoiceRecording()">🎤</button>
                    <button class="send-btn" onclick="sendMessage()">➤</button>
                </div>
                <div id="recordingIndicator" style="display: none; margin-top: 8px; padding: 8px; background: rgba(248,113,113,0.1); border-radius: 10px; font-size: 0.8rem;">

<script type="module">

// Вспомогательные функции
function showToast(message, type = 'info') {
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = message;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
}

function getInitials(name) {
    if (!name) return '?';
    return name.charAt(0).toUpperCase();
}

function formatTime(date) {
    if (!date) return '';
    const d = date.toDate ? date.toDate() : new Date(date);
    const now = new Date();
    if (d.toDateString() === now.toDateString()) {
        return d.toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' });
    }
    return d.toLocaleDateString('ru', { day: '2-digit', month: '2-digit' });
}

function formatDuration(seconds) {
    const mins = Math.floor(seconds / 60);
    const secs = seconds % 60;
    return `${mins}:${secs.toString().padStart(2, '0')}`;
}

function getAvatarColor(name) {
    const colors = [
        'linear-gradient(135deg, #6c63ff, #a78bfa)',
        'linear-gradient(135deg, #38bdf8, #06b6d4)',
        'linear-gradient(135deg, #22d3a5, #10b981)',
        'linear-gradient(135deg, #f59e0b, #f97316)',
        'linear-gradient(135deg, #ec4899, #a855f7)'
    ];
    let hash = 0;
    for (let i = 0; i < (name || '').length; i++) {
        hash = ((hash << 5) - hash) + name.charCodeAt(i);
        hash |= 0;
    }
    return colors[Math.abs(hash) % colors.length];
}

// Переключение вкладок авторизации
window.switchAuthTab = function(tab) {
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const tabs = document.querySelectorAll('.auth-tab');
    
    if (tab === 'login') {
        loginForm.style.display = 'block';
        registerForm.style.display = 'none';
        tabs[0].classList.add('active');
        tabs[1].classList.remove('active');
    } else {
        loginForm.style.display = 'none';
        registerForm.style.display = 'block';
        tabs[0].classList.remove('active');
        tabs[1].classList.add('active');
    }
};

// Регистрация
window.register = async function() {
    const nickname = document.getElementById('regNickname').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPassword').value;
    const errorDiv = document.getElementById('authError');
    
    if (!nickname || !email || !password) {
        errorDiv.textContent = 'Заполните все поля';
        return;
    }
    if (password.length < 6) {
        errorDiv.textContent = 'Пароль должен быть не менее 6 символов';
        return;
    }
    
    try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        await updateProfile(userCredential.user, { displayName: nickname });
        await setDoc(doc(db, 'users', userCredential.user.uid), {
            uid: userCredential.user.uid,
            nickname: nickname,
            email: email,
            avatar: null,
            role: 'member',
            online: true,
            createdAt: serverTimestamp(),
            bannedUntil: null,
            bannedReason: null
        });
        showToast('Аккаунт успешно создан!', 'success');
    } catch (error) {
        const errors = {
            'auth/email-already-in-use': 'Email уже используется',
            'auth/weak-password': 'Слабый пароль',
            'auth/invalid-email': 'Неверный формат email'
        };
        errorDiv.textContent = errors[error.code] || error.message;
    }
};

// Вход
window.login = async function() {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const errorDiv = document.getElementById('authError');
    
    if (!email || !password) {
        errorDiv.textContent = 'Заполните все поля';
        return;
    }
    
    try {
        await signInWithEmailAndPassword(auth, email, password);
        showToast('Добро пожаловать!', 'success');
    } catch (error) {
        const errors = {
            'auth/user-not-found': 'Пользователь не найден',
            'auth/wrong-password': 'Неверный пароль',
            'auth/invalid-credential': 'Неверный email или пароль'
        };
        errorDiv.textContent = errors[error.code] || error.message;
    }
};

// Выход
window.logout = async function() {
    if (currentUser) {
        await updateDoc(doc(db, 'users', currentUser.uid), { online: false });
    }
    await signOut(auth);
};

// Создание аккаунта Yura (владелец)

// Проверка бана
async function checkBan(userData) {
    if (userData.bannedUntil) {
        const banEnd = userData.bannedUntil.toDate ? userData.bannedUntil.toDate() : new Date(userData.bannedUntil);
        if (banEnd > new Date()) {
            await signOut(auth);
            showToast(`Вы заблокированы до ${banEnd.toLocaleString()} по причине: ${userData.bannedReason || 'нарушение правил'}`, 'error');
            return true;
        } else {
            await updateDoc(doc(db, 'users', currentUser.uid), { bannedUntil: null, bannedReason: null });
        }
    }
    return false;
}

// Состояние авторизации
onAuthStateChanged(auth, async (user) => {
    if (user) {
        currentUser = user;
        const userDoc = await getDoc(doc(db, 'users', user.uid));
        
        if (!userDoc.exists()) {
            await setDoc(doc(db, 'users', user.uid), {
                uid: user.uid,
                nickname: user.displayName || 'User',
                email: user.email,
                avatar: null,
                role: 'member',
                online: true,
                createdAt: serverTimestamp(),
                bannedUntil: null,
                bannedReason: null
            });
            currentUserData = {
                uid: user.uid,
                nickname: user.displayName || 'User',
                role: 'member'
            };
        } else {
            currentUserData = userDoc.data();
            if (await checkBan(currentUserData)) return;
            await updateDoc(doc(db, 'users', user.uid), { online: true });
        }
        
        document.getElementById('authScreen').style.display = 'none';
        document.getElementById('app').classList.add('show');
        
        await createYuraAccount();
        await loadAllUsers();
        await loadMyProfile();
        await loadChats();
    } else {
        if (currentUser) {
            await updateDoc(doc(db, 'users', currentUser.uid), { online: false }).catch(() => {});
        }
        document.getElementById('authScreen').style.display = 'flex';
        document.getElementById('app').classList.remove('show');
        currentUser = null;
        currentUserData = null;
        if (messagesUnsubscribe) messagesUnsubscribe();
        if (chatsUnsubscribe) chatsUnsubscribe();
    }
});

// Загрузка профиля
async function loadMyProfile() {
    const avatar = document.getElementById('myAvatar');
    if (currentUserData.avatar) {
        avatar.innerHTML = `<img src="${currentUserData.avatar}">`;
    } else {
        avatar.textContent = getInitials(currentUserData.nickname);
        avatar.style.background = getAvatarColor(currentUserData.nickname);
    }
    document.getElementById('myName').textContent = currentUserData.nickname;
    
    const roleNames = { owner: 'Владелец', admin: 'Администратор', member: 'Участник' };
    document.getElementById('myRole').textContent = roleNames[currentUserData.role] || 'Участник';
}

// Загрузка всех пользователей
async function loadAllUsers() {
    const snapshot = await getDocs(collection(db, 'users'));
    allUsers = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
}

// Загрузка чатов
async function loadChats() {
    if (chatsUnsubscribe) chatsUnsubscribe();
    
    const q = query(
        collection(db, 'chats'),
        where('members', 'array-contains', currentUser.uid),
        orderBy('lastMessageTime', 'desc')
    );
    
    chatsUnsubscribe = onSnapshot(q, (snapshot) => {
        allChats = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        renderChatList();
    }, (error) => {
        console.error('Ошибка загрузки чатов:', error);
        const q2 = query(collection(db, 'chats'), where('members', 'array-contains', currentUser.uid));
        chatsUnsubscribe = onSnapshot(q2, (snapshot) => {
            allChats = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            allChats.sort((a, b) => (b.lastMessageTime?.seconds || 0) - (a.lastMessageTime?.seconds || 0));
            renderChatList();
        });
    });
}

// Отображение списка чатов
function renderChatList() {
    const container = document.getElementById('chatList');
    const searchTerm = document.getElementById('searchInput').value.toLowerCase();
    let filteredChats = allChats;
    
    if (searchTerm) {
        filteredChats = allChats.filter(chat => {
            if (chat.type === 'group') {
                return chat.name?.toLowerCase().includes(searchTerm);
            } else {
                const otherId = chat.members.find(m => m !== currentUser.uid);
                const otherUser = allUsers.find(u => u.uid === otherId);
                return otherUser?.nickname?.toLowerCase().includes(searchTerm);
            }
        });
    }
    
    if (filteredChats.length === 0) {
        container.innerHTML = '<div style="padding: 20px; text-align: center; color: var(--text3);">Нет чатов</div>';
        return;
    }
    
    container.innerHTML = filteredChats.map(chat => {
        const isGroup = chat.type === 'group';
        let name, avatarContent, status;
        
        if (isGroup) {
            name = chat.name || 'Группа';
            avatarContent = '👥';
            status = `${chat.members?.length || 0} участников`;
        } else {
            const otherId = chat.members.find(m => m !== currentUser.uid);
            const otherUser = allUsers.find(u => u.uid === otherId);
            name = otherUser?.nickname || 'Пользователь';
            avatarContent = otherUser?.avatar ? `<img src="${otherUser.avatar}">` : getInitials(name);
            status = otherUser?.online ? '🟢 В сети' : '⚫ Не в сети';
        }
        
        const unread = chat.unread?.[currentUser.uid] || 0;
        const isActive = currentChatId === chat.id;
        
        return `
            <div class="chat-item ${isActive ? 'active' : ''}" onclick="selectChat('${chat.id}')">
                <div class="avatar" style="background: ${isGroup ? 'var(--bg4)' : getAvatarColor(name)}">
                    ${avatarContent}
                    ${!isGroup && allUsers.find(u => u.uid === chat.members?.find(m => m !== currentUser.uid))?.online ? '<div class="online-dot"></div>' : ''}
                </div>
                <div class="chat-info">
                    <div class="chat-name">${escapeHtml(name)}</div>
                    <div class="chat-last">${escapeHtml(chat.lastMessage || 'Нет сообщений')}</div>
                </div>
                <div class="chat-meta">
                    <div class="chat-time">${formatTime(chat.lastMessageTime)}</div>
                    ${unread > 0 ? `<div class="unread-badge">${unread}</div>` : ''}
                </div>
            </div>
        `;
    }).join('');
}

window.filterChats = function() {

};

window.selectChat = async function(chatId) {
    const chat = allChats.find(c => c.id === chatId);
    if (!chat) return;
    
    currentChat = chat;
    currentChatId = chatId;
    
    // Сброс непрочитанных
    const unreadUpdate = {};
    unreadUpdate[`unread.${currentUser.uid}`] = 0;
    await updateDoc(doc(db, 'chats', chatId), unreadUpdate).catch(() => {});
    
    const isGroup = chat.type === 'group';
    let name, avatarContent, status;
    
    if (isGroup) {
        name = chat.name || 'Группа';
        avatarContent = '👥';
        status = `${chat.members?.length || 0} участников`;
    } else {
        const otherId = chat.members.find(m => m !== currentUser.uid);
        const otherUser = allUsers.find(u => u.uid === otherId);
        name = otherUser?.nickname || 'Пользователь';
        avatarContent = otherUser?.avatar ? `<img src="${otherUser.avatar}">` : getInitials(name);
        status = otherUser?.online ? '🟢 В сети' : '⚫ Не в сети';
    }
    
    document.getElementById('chatAvatar').innerHTML = avatarContent;
    document.getElementById('chatAvatar').style.background = isGroup ? 'var(--bg4)' : getAvatarColor(name);
    document.getElementById('chatTitle').textContent = name;
    document.getElementById('chatStatus').textContent = status;
    
    document.getElementById('noChatSelected').style.display = 'none';
    document.getElementById('chatScreen').style.display = 'flex';
    
    renderChatList();
    loadMessages();
};

// Загрузка сообщений
function loadMessages() {
    if (messagesUnsubscribe) messagesUnsubscribe();
    
    const messagesRef = collection(db, 'chats', currentChatId, 'messages');
    const q = query(messagesRef, orderBy('createdAt', 'asc'));
    
    messagesUnsubscribe = onSnapshot(q, (snapshot) => {
        const messagesArea = document.getElementById('messagesArea');
        messagesArea.innerHTML = '';
        
        if (snapshot.empty) {
            messagesArea.innerHTML = '<div style="text-align: center; color: var(--text3); padding: 40px;">Нет сообщений</div>';
            return;
        }
        
        snapshot.forEach(doc => {
            renderMessage(doc.id, doc.data());
        });
        
        messagesArea.scrollTop = messagesArea.scrollHeight;
    });
}

function renderMessage(id, message) {
    const isMine = message.senderId === currentUser.uid;
    const sender = allUsers.find(u => u.uid === message.senderId);
    const senderName = sender?.nickname || message.senderName || '?';
    
    if (message.type === 'system') {
        const div = document.createElement('div');
        div.className = 'system-message';
        div.textContent = message.text;
        document.getElementById('messagesArea').appendChild(div);
        return;
    }
    
    const row = document.createElement('div');
    row.className = `message-row ${isMine ? 'mine' : ''}`;
    
    let bubbleContent = '';
    
    if (message.type === 'image') {
        bubbleContent = `<img class="message-image" src="${message.url}" onclick="openLightbox('${message.url}')">`;
    } else if (message.type === 'video') {
        bubbleContent = `<video class="message-video" controls src="${message.url}"></video>`;
    } else if (message.type === 'voice') {
        bubbleContent = `
            <div class="message-voice" onclick="playVoice('${message.url}', this)">
                <div class="voice-play">▶️</div>
                <div class="voice-wave">${'<div class="wave-bar" style="height: 20px"></div>'.repeat(15)}</div>
                <div class="voice-duration">${message.duration || '0:00'}</div>
            </div>
        `;
    } else {
        bubbleContent = `<div class="bubble">${escapeHtml(message.text || '')}</div>`;
    }
    
    if ((message.type === 'image' || message.type === 'video' || message.type === 'voice') && !bubbleContent.includes('bubble')) {
        bubbleContent = `<div class="bubble" style="padding: 6px; background: ${isMine ? 'linear-gradient(135deg, var(--accent), #5b52e0)' : 'var(--bg3)'}">${bubbleContent}</div>`;
    }
    
    const senderInfo = currentChat?.type === 'group' && !isMine ? `<div class="sender-name">${escapeHtml(senderName)}</div>` : '';
    
    row.innerHTML = `
        ${!isMine ? `<div class="avatar message-avatar" style="background: ${getAvatarColor(senderName)}">${sender?.avatar ? `<img src="${sender.avatar}">` : getInitials(senderName)}</div>` : ''}
        <div class="message-bubble ${isMine ? 'mine' : ''}">
            ${senderInfo}
            ${bubbleContent}
            <div class="message-time">${formatTime(message.createdAt)}</div>
        </div>
        ${isMine ? `<div class="avatar message-avatar" style="background: ${getAvatarColor(currentUserData.nickname)}">${currentUserData.avatar ? `<img src="${currentUserData.avatar}">` : getInitials(currentUserData.nickname)}</div>` : ''}
    `;
    
    document.getElementById('messagesArea').appendChild(row);
}

// Отправка сообщения
window.sendMessage = async function() {
    if (!currentChatId) {
        showToast('Выберите чат', 'error');
        return;
    }
    
    const input = document.getElementById('messageInput');
    const text = input.value.trim();
    
    if (pendingFile) {
        await uploadAndSendMedia();
        return;
    }
    
    if (!text) return;
    
    input.value = '';
    input.style.height = 'auto';
    
    const message = {
        senderId: currentUser.uid,
        senderName: currentUserData.nickname,
        text: text,
        type: 'text',
        createdAt: serverTimestamp()
    };
    
    await addDoc(collection(db, 'chats', currentChatId, 'messages'), message);
    await updateChatLastMessage(text);
};

async function uploadAndSendMedia() {
    if (!pendingFile) return;
    
    showToast('Загрузка файла...', 'info');
    
    try {
        const fileRef = ref(storage, `chats/${currentChatId}/${Date.now()}_${pendingFile.name}`);
        await uploadBytes(fileRef, pendingFile);
        const url = await getDownloadURL(fileRef);
        
        const message = {
            senderId: currentUser.uid,
            senderName: currentUserData.nickname,
            type: pendingFileType,
            url: url,
            text: '',
            createdAt: serverTimestamp()
        };
        
        if (pendingFileType === 'voice') {
            message.duration = document.getElementById('recordingTimer').textContent;
        }
        
        await addDoc(collection(db, 'chats', currentChatId, 'messages'), message);
        await updateChatLastMessage(pendingFileType === 'image' ? '📷 Фото' : pendingFileType === 'video' ? '🎥 Видео' : '🎤 Голосовое');
        
        showToast('Отправлено!', 'success');
        clearMediaPreview();
    } catch (error) {
        showToast('Ошибка загрузки: ' + error.message, 'error');
    }
}

async function updateChatLastMessage(text) {
    const chatRef = doc(db, 'chats', currentChatId);
    const members = currentChat?.members || [];
    const unreadUpdate = {};
    
    members.forEach(member => {
        if (member !== currentUser.uid) {
            unreadUpdate[`unread.${member}`] = (currentChat?.unread?.[member] || 0) + 1;
        }
    });
    
    await updateDoc(chatRef, {
        lastMessage: text,
        lastMessageTime: serverTimestamp(),
        ...unreadUpdate
    });
}

// Голосовые сообщения
window.toggleVoiceRecording = async function() {
    if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
        return;
    }
    
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        let seconds = 0;
        
        mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
        
        mediaRecorder.onstop = async () => {
            clearInterval(recordingInterval);
            document.getElementById('recordingIndicator').style.display = 'none';
            document.getElementById('voiceBtn').textContent = '🎤';
            stream.getTracks().forEach(track => track.stop());
            
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            if (audioBlob.size < 1000) return;
            
            pendingFile = new File([audioBlob], `voice_${Date.now()}.webm`, { type: 'audio/webm' });
            pendingFileType = 'voice';
            document.getElementById('recordingTimer').textContent = formatDuration(seconds);
            
            await uploadAndSendMedia();
        };
        
        mediaRecorder.start();
        document.getElementById('voiceBtn').textContent = '⏹️';
        document.getElementById('recordingIndicator').style.display = 'block';
        
        recordingInterval = setInterval(() => {
            seconds++;
            document.getElementById('recordingTimer').textContent = formatDuration(seconds);
        }, 1000);
        
    } catch (error) {
        showToast('Нет доступа к микрофону', 'error');
    }
};

window.cancelRecording = function() {
    if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.onstop = () => {};
        mediaRecorder.stop();
    }
    clearInterval(recordingInterval);
    document.getElementById('recordingIndicator').style.display = 'none';
    document.getElementById('voiceBtn').textContent = '🎤';
};

window.playVoice = function(url, element) {
    const audio = new Audio(url);
    audio.play();
    const playBtn = element.querySelector('.voice-play');
    playBtn.textContent = '⏸️';
    audio.onended = () => playBtn.textContent = '▶️';
};

window.startCall = function(type) {

    if (isGroup) {

window.openBanModal = function(uid, name) {
    banTargetUid = uid;
    banTargetName = name;

window.executeBan = async function() {
    const reason = document.getElementById('banReason').value.trim() || 'Нарушение правил';
    const duration = document.getElementById('banDuration').value;
    
    let banUntil;
    const now = new Date();
    
    switch(duration) {
        case '1h': banUntil = new Date(now.getTime() + 60 * 60 * 1000); break;
        case '24h': banUntil = new Date(now.getTime() + 24 * 60 * 60 * 1000); break;
        case '7d': banUntil = new Date(now.getTime() + 7 * 24 * 60 * 60 * 1000); break;
        case '30d': banUntil = new Date(now.getTime() + 30 * 24 * 60 * 60 * 1000); break;
        case 'forever': banUntil = new Date(now.getTime() + 100 * 365 * 24 * 60 * 60 * 1000); break;
        default: banUntil = new Date(now.getTime() + 60 * 60 * 1000);
    }
    
    await updateDoc(doc(db, 'users', banTargetUid), {
        bannedUntil: banUntil,
        bannedReason: reason
    });
    
    // Добавляем системное сообщение в чат
    await addDoc(collection(db, 'chats', currentChatId, 'messages'), {
        type: 'system',
        text: `🔨 ${currentUserData.nickname} заблокировал ${banTargetName} до ${banUntil.toLocaleString()} по причине: ${reason}`,
        senderId: currentUser.uid,
        createdAt: serverTimestamp()
    });
    
    closeModal('banModal');
    showToast(`Пользователь ${banTargetName} заблокирован`, 'success');
};

window.openLightbox = function(url) {
    const lightbox = document.createElement('div');
    lightbox.style.cssText = 'position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 2000; cursor: pointer;';
    lightbox.innerHTML = `<img src="${url}" style="max-width: 90vw; max-height: 90vh; border-radius: 12px;">`;
    lightbox.onclick = () => lightbox.remove();
    document.body.appendChild(lightbox);
};

window.handleKeyPress = function(event) {
    if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
    }
};

window.autoResize = function(element) {
    element.style.height = 'auto';
    element.style.height = Math.min(element.scrollHeight, 100) + 'px';
};

function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}
